<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포레스트핏 장기지연 납기 자동 시스템 V60</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>
<style>
body { font-family: Arial, "Noto Sans KR", sans-serif; margin:0; background:#FFF9E8; color:#4A3A12; }
.wrap { max-width:1280px; margin:auto; padding:30px; }
h1 { color:#6B5310; }
.card { background:#FFFDF7; border:1px solid #E7D8A3; border-radius:12px; padding:18px; margin-bottom:15px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
input,textarea,select { width:100%; padding:10px; margin-top:6px; margin-bottom:12px; border:1px solid #465163; border-radius:8px; }
button { width:100%; padding:12px; border:none; border-radius:8px; background:#C9A227; font-weight:bold; cursor:pointer; margin-top:10px; }
.small { font-size:12px; color:#777; }
</style>
</head>
<body>
<div class="wrap">
<h1>포레스트핏 장기지연 납기 자동 시스템 V60</h1>

<div class="card">
<label>1. 셀메이트 파일 업로드</label>
<input type="file" id="file1">
<div class="small">
<b>첨부 파일 다운로드 방법:</b><br>
1. 셀메이트 접속<br>
2. 주문관리 메뉴 클릭<br>
3. 판매처분류에서 GS 제외 전 채널 선택<br>
4. 조회기간 설정<br>
5. 파일 다운로드 후 업로드
</div>
</div>

<div class="card">
<label>2. 브리치 파일 업로드</label>
<input type="file" id="file2">
<div class="small">
<b>첨부 파일 다운로드 방법:</b><br>
1. 브리치 접속<br>
2. 비플로우 주문 상태 다운로드<br>
3. 파일 업로드
</div>
</div>

<div class="card">
<label>공휴일 입력 (예: 2026-07-17)</label>
<textarea id="holiday"></textarea>
</div>

<div class="card">
<button onclick="run()">계산 실행</button>
<button onclick="downloadExcel()">결과 다운로드</button>
</div>

<div class="card">
<div id="status"></div>
</div>
</div>

<script>
let wb1, wb2, result=[];

// 공휴일 처리
function getHolidays() {
  return document.getElementById("holiday").value
    .split("\n")
    .map(v => v.trim())
    .filter(Boolean);
}
function isWeekend(d) { return d.getDay() === 0 || d.getDay() === 6; }
function isHoliday(d, holidays){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
  return holidays.includes(`${y}-${m}-${dd}`);
}
function addBusinessDays(d, n, holidays){
  let count=0, dt=new Date(d);
  while(count<n){
    dt.setDate(dt.getDate()+1);
    if(!isWeekend(dt) && !isHoliday(dt, holidays)) count++;
  }
  return dt;
}
function addMonth(d, n){ let dt=new Date(d); dt.setMonth(dt.getMonth()+n); return dt; }

// 괄호 안 값 추출
function extractBracket(v){
  const s=String(v||"");
  const m=s.match(/\(([^()]*)\)/); return m? m[1] : "";
}

// 옵션 전처리
function cleanOption(v){
  if(!v) return "";
  return String(v).replace(/\s/g,"").replace(/\//g,",").replace(/_/g,"").replace(/기본옵션:옵션/g,"")
                   .replace(/-/g,"").replace(/[A-Za-z]+\d+/g,"");
}

// 파일 로딩
document.getElementById("file1").onchange = async (e) => { wb1 = XLSX.read(await e.target.files[0].arrayBuffer(), {type:"array"}); }
document.getElementById("file2").onchange = async (e) => { wb2 = XLSX.read(await e.target.files[0].arrayBuffer(), {type:"array"}); }

// 계산 실행
function run(){
  if(!wb1 || !wb2){ alert("파일 2개 모두 필요"); return; }
  const holidays = getHolidays();

  const sheet1 = wb1.SheetNames[0];
  const data1 = XLSX.utils.sheet_to_json(wb1.Sheets[sheet1], {header:1, defval:""});
  const sheet2 = wb2.SheetNames[0];
  const data2 = XLSX.utils.sheet_to_json(wb2.Sheets[sheet2], {header:1, defval:""});

  // 브리치 맵 생성
  const brichMap = new Map();
  for(let i=1;i<data2.length;i++){
    const r=data2[i]; if(!r) continue;
    brichMap.set(r[1], {ship:r[19], channel:r[4], option:cleanOption(r[11]), product:extractBracket(r[6])});
  }

  result = [];
  for(let i=1;i<data1.length;i++){
    const r=data1[i]; if(!r) continue;

    let iDate = r[8] ? new Date(r[8]) : null;
    let jDate = null;

    // 비플로우 주문
    if(r[2]==="비플로우"){
      const b = brichMap.get(r[3]);
      if(b) jDate = new Date(b.ship);
    } else {
      // 다른 채널
      if(r[2]==="퀸잇") jDate = addBusinessDays(new Date(r[0]),21,holidays);
      else if(r[2]==="하프클럽") jDate = addBusinessDays(new Date(r[0]),15,holidays);
      else jDate = addMonth(new Date(r[0]),1);
    }

    // 입고일 체크
    let iValue = iDate? iDate : "입고일 기입 요망";

    // 진행상황 L열
    let lValue = "";
    if(r[2]==="비플로우" && jDate){
      if(brichMap.get(r[3])){
        const ch = brichMap.get(r[3]).channel;
        if(["지마켓","옥션","SSG"].includes(ch)) lValue=`${ch} 출고준수일 연장전 / 연장시 ${addBusinessDays(jDate,14,holidays).toISOString().slice(0,10)}`;
        else if(ch==="카카오스타일") lValue=`${ch} 출고준수일 연장전 / 연장시 ${addBusinessDays(jDate,7,holidays).toISOString().slice(0,10)}`;
        else if(ch==="CJ몰") lValue=`${ch} 출고준수일 연장전 / 연장시 ${addBusinessDays(jDate,3,holidays).toISOString().slice(0,10)}`;
        else if(["롯데I몰","홈앤쇼핑"].includes(ch)) lValue=`${ch} 출고예정일 연장 불가`;
      }
    }

    result.push([
      r[0], r[1], r[2], r[3], r[4], r[5],
      extractBracket(r[6]), r[7],
      iValue,
      jDate? jDate.toISOString().slice(0,10): "",
      "", lValue, ""
    ]);
  }

  document.getElementById("status").innerText = "완료: " + result.length + "건";
}

// 다운로드
function downloadExcel(){
  if(!result.length){ alert("결과 없음"); return; }
  const ws = XLSX.utils.aoa_to_sheet([
    ["주문일자","지연일","판매처명","주문번호","공급처명","사입상품명","판매처상품명","옵션","입고예정일","출고준수일","출고불가","진행상황","처리결과"],
    ...result
  ]);

  // 스타일 설정
  const cols = [{wpx:20},{wpx:15},{wpx:20},{wpx:20},{wpx:20},{wpx:25},{wpx:25},{wpx:15},{wpx:20},{wpx:20},{wpx:15},{wpx:35},{wpx:20}];
  ws['!cols'] = cols;
  ws['!rows'] = [{hpt:60}];
  for(let C of ['A','I','J']){
    for(let i=1;i<=result.length;i++){
      const cell = ws[C+(i+1)];
      if(cell && cell.v) cell.z='yyyy-mm-dd';
    }
  }

  // 수식 K열
  for(let i=1;i<=result.length;i++){
    const iVal = ws['I'+(i+1)]?.v;
    const jVal = ws['J'+(i+1)]?.v;
    ws['K'+(i+1)] = {f:`=IF(OR(I${i+1}="",I${i+1}>J${i+1}),"출고불가","")`, t:'s', s:{font:{color:{rgb:"FF0000"},bold:true},alignment:{horizontal:"center"}}};
  }

  // 헤더 스타일
  for(let c=0;c<13;c++){
    const cell = ws[XLSX.utils.encode_col(c)+'1'];
    if(cell){
      cell.s={font:{bold:true,sz:12},fill:{fgColor:{rgb:"D3D3D3"}},alignment:{horizontal:"center",vertical:"center"}};
    }
  }

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"결과");
  XLSX.writeFile(wb,"장기지연_결과_V60.xlsx");
}
</script>
</body>
</html>
