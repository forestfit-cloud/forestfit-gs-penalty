<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>FORESTFIT V50 FINAL ENGINE</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>
<style>
body{font-family:Arial;background:#FFF9E8;margin:0}
.wrap{max-width:1200px;margin:auto;padding:30px}
.card{background:#fff;border:1px solid #ddd;padding:12px;margin-bottom:10px}
button{width:100%;padding:10px;background:#C9A227;border:0;font-weight:bold}
h2{margin-bottom:10px}
.small{font-size:12px;color:#777}
</style>
</head>
<body>

<div class="wrap">
<h2>FORESTFIT V50 FINAL ENGINE</h2>
<div class="small">I/J 날짜, 비플로우 + 채널별 L열 연동, G열 괄호 추출 완전 안정화</div>

<div class="card"><input type="file" id="file1"></div>
<div class="card"><input type="file" id="file2"></div>

<div class="card">
<label>공휴일 입력 (YYYY-MM-DD 줄바꿈)</label>
<textarea id="holiday"></textarea>
</div>

<div class="card">
<button onclick="run()">계산 실행</button>
<button onclick="downloadExcel()" id="downloadBtn" disabled>다운로드</button>
</div>

<div id="status">파일 업로드 후 실행</div>
</div>

<script>
let wb1, wb2, brichMap=new Map(), result=[], isReady=false;

function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function toDate(v){if(!v) return null; if(typeof v==="number") return new Date(Math.round((v-25569)*86400*1000)); const d=new Date(v); return isNaN(d)?null:d;}
function getHolidays(){return document.getElementById("holiday").value.split("\n").map(v=>v.trim()).filter(Boolean);}
function addBusinessDays(date, days, holidays){
  let d=new Date(date), count=0;
  while(count<days){
    d.setDate(d.getDate()+1);
    const ymd=fmt(d);
    if(d.getDay()===0||d.getDay()===6) continue;
    if(holidays.includes(ymd)) continue;
    count++;
  }
  return d;
}
function getBracket(v){const m=String(v||"").match(/\(([^()]*)\)/); return m?m[1]:"";}

document.getElementById("file1").onchange=async(e)=>{ wb1=XLSX.read(await e.target.files[0].arrayBuffer(),{type:"array"}); checkReady();}
document.getElementById("file2").onchange=async(e)=>{ wb2=XLSX.read(await e.target.files[0].arrayBuffer(),{type:"array"}); checkReady();}

function checkReady(){
  if(wb1 && wb2){document.getElementById("status").innerText="파일 준비 완료 → 계산 실행 가능"; isReady=true; document.getElementById("downloadBtn").disabled=false;}
}

function buildBrich(data){
  brichMap.clear();
  for(let i=1;i<data.length;i++){
    const r=data[i];
    if(!r) continue;
    const orderNo=String(r[1]||"").trim();
    brichMap.set(orderNo,r);
  }
}

function calcI_Bflow(orderNo, baseDate){
  const rows = Array.from(brichMap.values());
  for(const r of rows){
    const bOrder=String(r[1]||"");
    if(bOrder!==orderNo) continue;
    const bDate=toDate(r[0]);
    const diff=(bDate-baseDate)/(1000*60*60*24);
    if(diff>=1 && diff<=5){
      return r[19]; // T열 입고예정일
    }
  }
  return "";
}

function calcJ(r, holidays){
  const seller=String(r[2]||""), orderDate=toDate(r[0]);
  if(!orderDate) return "";
  if(seller.includes("퀸잇")) return fmt(addBusinessDays(orderDate,21,holidays));
  if(seller.includes("하프클럽")) return fmt(addBusinessDays(orderDate,15,holidays));
  if(seller.includes("네이버")||seller.includes("롯데ON")){
    const d=new Date(orderDate); d.setMonth(d.getMonth()+1); return fmt(d);
  }
  return fmt(orderDate);
}

function calcL(channel, J, holidays){
  const jDate=toDate(J);
  if(channel.includes("지마켓")||channel.includes("옥션")||channel.includes("SSG")){
    const d=addBusinessDays(jDate,14,holidays); return `${channel} 출고준수일 연장전 / 연장시[${fmt(d)}]`;
  }
  if(channel.includes("카카오스타일")){
    const d=addBusinessDays(jDate,7,holidays); return `${channel} 출고준수일 연장전 / 연장시[${fmt(d)}]`;
  }
  if(channel.includes("CJ몰")){
    const d=addBusinessDays(jDate,3,holidays); return `${channel} 출고준수일 연장전 / 연장시[${fmt(d)}]`;
  }
  if(channel.includes("롯데I몰")||channel.includes("홈앤쇼핑")) return `${channel} 출고예정일 연장 불가`;
  return "";
}

function run(){
  if(!isReady){alert("파일 2개 업로드 후 실행"); return;}
  const holi=getHolidays();
  const d1=XLSX.utils.sheet_to_json(wb1.Sheets[wb1.SheetNames[0]],{header:1,defval:""});
  const d2=XLSX.utils.sheet_to_json(wb2.Sheets[wb2.SheetNames[0]],{header:1,defval:""});
  buildBrich(d2);
  result=[];
  result.push(["주문일자","지연일","판매처명","주문번호","공급처명","사입상품명","판매처 상품명","옵션","입고예정일","출고 준수일","출고불가 여부","진행상황","처리결과"]);
  for(let i=1;i<d1.length;i++){
    const r=d1[i]; if(!r) continue;
    const A=toDate(r[0])?fmt(toDate(r[0])):"";
    const I=r[2]==="비플로우"?calcI_Bflow(r[3],toDate(r[0])):"";
    const J=calcJ(r,holi);
    const L=calcL(r[4]||"",J,holi);
    const G=getBracket(r[6]);
    result.push([A,r[1],r[2],r[3],r[4],r[5],G,r[7],I,J,"",L,""]);
  }
  document.getElementById("status").innerText="완료: "+(result.length-1)+"건";
}

function downloadExcel(){
  if(!isReady||result.length===0){alert("먼저 계산 실행"); return;}
  const ws=XLSX.utils.aoa_to_sheet(result);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"result");
  XLSX.writeFile(wb,"V50_FINAL.xlsx");
}
</script>
</body>
</html>
