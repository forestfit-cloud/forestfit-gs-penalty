<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>포레스트핏 장기지연 납기 자동 시스템 V63</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{
    margin:0;
    padding:0;
    background:#f7f7f5;
    font-family:"Noto Sans KR",Arial,sans-serif;
    color:#333;
}

.container{
    width:900px;
    margin:40px auto;
}

.title{
    font-size:28px;
    font-weight:700;
    text-align:center;
    margin-bottom:30px;
    color:#222;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:25px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.label{
    font-weight:700;
    margin-bottom:8px;
    display:block;
}

input[type=file],
textarea{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:14px;
}

textarea{
    height:100px;
    resize:none;
}

.info{
    margin-top:10px;
    font-size:13px;
    color:#777;
    line-height:1.6;
}

.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#222;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-top:10px;
}

.btn:hover{
    opacity:.85;
}

.status{
    margin-top:15px;
    font-size:14px;
    font-weight:700;
}

</style>

</head>


<body>

<div class="container">

<div class="title">
포레스트핏 장기지연 납기 자동 시스템 V63
</div>


<div class="card">

<label class="label">
1. 셀메이트 파일 업로드
</label>

<input type="file" id="file1" accept=".xlsx,.xls">

<div class="info">

다운로드 방법<br>
1) 셀메이트 접속<br>
2) 주문관리 이동<br>
3) 판매처 전체 조회<br>
4) 엑셀 다운로드 후 업로드

</div>

</div>



<div class="card">

<label class="label">
2. 브리치 파일 업로드
</label>

<input type="file" id="file2" accept=".xlsx,.xls">


<div class="info">

다운로드 방법<br>
1) 브리치 접속<br>
2) 비플로우 주문 파일 다운로드<br>
3) 다운로드 파일 업로드

</div>


</div>




<div class="card">

<label class="label">
공휴일 입력
</label>


<textarea 
id="holiday"
placeholder="예시) 2026-07-17

한 줄에 하나씩 입력">
</textarea>


</div>



<div class="card">

<button class="btn" onclick="calculate()">
계산 실행
</button>


<button class="btn" onclick="downloadExcel()">
결과 다운로드
</button>


<div class="status" id="status"></div>


</div>


</div>



<script>


let wb1=null;
let wb2=null;

let resultData=[];



// ===============================
// 파일 업로드
// ===============================


document.getElementById("file1").addEventListener("change",async function(e){

    const file=e.target.files[0];

    if(!file) return;

    wb1=XLSX.read(
        await file.arrayBuffer(),
        {
            type:"array",
            cellDates:true
        }
    );

});




document.getElementById("file2").addEventListener("change",async function(e){

    const file=e.target.files[0];

    if(!file) return;

    wb2=XLSX.read(
        await file.arrayBuffer(),
        {
            type:"array",
            cellDates:true
        }
    );

});





// ===============================
// 공휴일
// ===============================


function getHoliday(){

    return document
    .getElementById("holiday")
    .value
    .split("\n")
    .map(v=>v.trim())
    .filter(v=>v);

}





function dateString(d){

    if(!(d instanceof Date)) return "";

    let y=d.getFullYear();
    let m=String(d.getMonth()+1).padStart(2,"0");
    let day=String(d.getDate()).padStart(2,"0");

    return `${y}-${m}-${day}`;

}





function isWeekend(d){

    return d.getDay()===0 || d.getDay()===6;

}





function isHoliday(d){

    let holidays=getHoliday();

    return holidays.includes(dateString(d));

}





// ===============================
// 영업일 계산
// ===============================


function addBusinessDays(date,days){

    let d=new Date(date);

    let count=0;


    while(count<days){

        d.setDate(
            d.getDate()+1
        );


        if(
            !isWeekend(d)
            &&
            !isHoliday(d)
        ){

            count++;

        }

    }


    return d;

}





// ===============================
// 날짜 안전 변환
// ===============================


function safeDate(value){

    if(!value) return null;


    if(value instanceof Date){

        if(!isNaN(value.getTime()))
            return value;

        return null;

    }


    let text=String(value).trim();



    if(
        text===""
        ||
        text==="NaN"
        ||
        text==="Invalid Date"
    ){

        return null;

    }



    let match=text.match(
        /^(\d{4})-(\d{2})-(\d{2})$/
    );



    if(match){

        let d=new Date(
            Number(match[1]),
            Number(match[2])-1,
            Number(match[3])
        );


        if(!isNaN(d.getTime()))
            return d;

    }



    return null;

}




// ===============================
// 상품명 괄호 추출
// ===============================


function extractBracket(value){

    let text=String(value||"");

    let result=text.match(
        /\(([^()]*)\)/
    );


    return result ? result[1] : "";

}





// ===============================
// 옵션 정리
// ===============================


function cleanOption(value){

    if(!value)
        return "";


    return String(value)

    .replace(/\s/g,"")

    .replace(/\//g,",")

    .replace(/_/g,"")

    .replace(/기본옵션:옵션/g,"")

    .replace(/-/g,"")

    .replace(/[A-Za-z]+\d+/g,"");

}






// ===============================
// 비플로우 매칭 데이터 생성
// ===============================


function createBflowMap(){

    let map=[];


    if(!wb2)
        return map;



    const sheet =
    wb2.Sheets[wb2.SheetNames[0]];



    const rows =
    XLSX.utils.sheet_to_json(
        sheet,
        {
            header:1,
            defval:"",
            raw:true
        }
    );



    for(let i=1;i<rows.length;i++){


        let r=rows[i];


        if(!r || !r[1])
            continue;



        map.push({

            orderNo:String(r[1]).trim(),

            channel:r[4] || "",

            product:extractBracket(r[10]),

            option:cleanOption(r[11]),

            shipDate:safeDate(r[19])

        });


    }


    return map;

}





// ===============================
// 비플로우 출고일 찾기
// 주문번호 우선
// 중복 시 상품명+옵션 비교
// ===============================


function findBflowDate(orderNo, product, option, bflowData){


    let sameOrder =
    bflowData.filter(v=>
        String(v.orderNo)===String(orderNo)
    );



    if(sameOrder.length===0)
        return null;



    // 주문번호 단독 1건
    if(sameOrder.length===1){

        return sameOrder[0].shipDate;

    }




    // 중복 주문번호
    let match =
    sameOrder.find(v=>

        v.product===product
        &&
        v.option===option

    );



    if(match)
        return match.shipDate;




    return null;


}






// ===============================
// L열 진행상황
// ===============================


function getProgress(channel, jDate){


    if(!channel || !jDate)
        return "";



    let today =
    new Date();



    let diff=0;

    let temp =
    new Date(jDate);



    while(temp < today){

        temp.setDate(
            temp.getDate()+1
        );


        if(
            !isWeekend(temp)
            &&
            !isHoliday(temp)
        ){

            diff++;

        }

    }




    // 비플로우 + 1~5 영업일 범위만 적용

    if(diff<1 || diff>5)
        return "";




    let addDay=0;



    if(
        channel==="지마켓"
        ||
        channel==="옥션"
        ||
        channel==="SSG"
    ){

        addDay=14;

    }


    else if(
        channel==="카카오스타일"
    ){

        addDay=7;

    }


    else if(
        channel==="CJ몰"
    ){

        addDay=3;

    }


    else if(
        channel==="롯데I몰"
        ||
        channel==="홈앤쇼핑"
    ){

        return `${channel} 출고예정일 연장 불가`;

    }


    else{

        return "";

    }





    let extendDate =
    addBusinessDays(
        jDate,
        addDay
    );



    return `${channel} 출고준수일 연장전 / 연장시 ${dateString(extendDate)}`;

}





// ===============================
// 계산 실행
// ===============================


function calculate(){


    if(!wb1){

        alert("1번 파일을 업로드해주세요.");

        return;

    }



    let bflowData =
    createBflowMap();



    const sheet =
    wb1.Sheets[wb1.SheetNames[0]];



    const rows =
    XLSX.utils.sheet_to_json(
        sheet,
        {
            header:1,
            defval:"",
            raw:true
        }
    );



    resultData=[];




    resultData.push([

        "주문일자",
        "지연일",
        "판매처명",
        "주문번호",
        "공급처명",
        "사입상품명",
        "판매처상품명",
        "옵션",
        "입고예정일",
        "출고준수일",
        "출고불가 여부",
        "진행상황",
        "처리결과"

    ]);





    for(let i=1;i<rows.length;i++){


        let r=rows[i];


        if(!r)
            continue;




        let orderDate =
        safeDate(r[0]);



        let inboundDate =
        safeDate(r[8]);



        let seller =
        r[2] || "";



        let product =
        extractBracket(r[6]);



        let option =
        cleanOption(r[7]);



        let jDate=null;





        // ===================
        // J열 출고준수일
        // ===================


        if(seller==="비플로우"){


            jDate =
            findBflowDate(
                r[3],
                product,
                option,
                bflowData
            );


        }



        else if(seller==="퀸잇"){


            jDate =
            addBusinessDays(
                orderDate,
                21
            );


        }



        else if(seller==="하프클럽"){


            jDate =
            addBusinessDays(
                orderDate,
                15
            );


        }



        else if(

            seller==="네이버 스마트스토어"
            ||
            seller==="롯데ON"
            ||
            seller==="카카오톡스토어"

        ){


            jDate =
            new Date(orderDate);


            jDate.setMonth(
                jDate.getMonth()+1
            );


        }





        let iValue =
        inboundDate
        ?
        inboundDate
        :
        "입고일 기입 요망";



        let lValue="";



        if(seller==="비플로우"){


            let channel="";


            let bMatch =
            bflowData.find(v=>

                String(v.orderNo)===String(r[3])

                &&
                v.product===product

                &&
                v.option===option

            );



            if(bMatch){

                channel=bMatch.channel;


                lValue=
                getProgress(
                    channel,
                    jDate
                );

            }


        }




        resultData.push([


            orderDate,

            r[1],

            seller,

            r[3],

            r[4],

            r[5],

            product,

            r[7],

            iValue,

            jDate,

            "",

            lValue,

            ""


        ]);



    }



    document.getElementById("status").innerText =
    "계산 완료 : "
    +(resultData.length-1)
    +"건";


}



// ===============================
// 엑셀 다운로드
// 날짜 오류 방지 핵심
// ===============================


function downloadExcel(){


    if(resultData.length===0){

        alert("계산 먼저 실행해주세요.");

        return;

    }



    let ws =
    XLSX.utils.aoa_to_sheet(
        resultData
    );



    // ===============================
    // A / I / J 날짜 처리
    // 날짜만 날짜타입 적용
    // 문자는 문자 유지
    // ===============================


    for(let i=1;i<resultData.length;i++){


        let excelRow=i+1;



        setDateCell(
            ws,
            "A"+excelRow,
            resultData[i][0]
        );



        setDateCell(
            ws,
            "I"+excelRow,
            resultData[i][8]
        );



        setDateCell(
            ws,
            "J"+excelRow,
            resultData[i][9]
        );


    }






    // ===============================
    // K열 수식
    // I 문자 또는 I > J
    // ===============================


    for(let i=2;i<=resultData.length;i++){


        ws["K"+i]={

            t:"n",

            f:
            `IF(OR(ISTEXT(I${i}),I${i}>J${i}),"출고불가","")`

        };


    }






    // ===============================
    // 스타일 적용
    // ===============================



    const headerStyle={

        fill:{
            fgColor:{
                rgb:"FFD9D9D9"
            }
        },

        font:{
            bold:true,
            sz:12
        },

        alignment:{
            horizontal:"center",
            vertical:"center"
        }

    };




    for(let c=0;c<13;c++){

        let cell =
        XLSX.utils.encode_cell({
            r:0,
            c:c
        });


        if(ws[cell]){

            ws[cell].s=headerStyle;

        }


    }






    // 전체 가운데 정렬


    Object.keys(ws).forEach(key=>{


        if(key[0]==="!") 
            return;



        if(!ws[key].s)
            ws[key].s={};



        ws[key].s.alignment={

            horizontal:"center",

            vertical:"center"

        };


    });






    // ===============================
    // 입고일 기입 요망 빨간색
    // ===============================



    for(let i=2;i<=resultData.length;i++){


        let cell =
        ws["I"+i];


        if(
            cell
            &&
            cell.v==="입고일 기입 요망"
        ){


            cell.s={

                font:{

                    color:{
                        rgb:"FFFF0000"
                    },

                    bold:true

                },

                alignment:{

                    horizontal:"center",

                    vertical:"center"

                }

            };


        }


    }






    let wb =
    XLSX.utils.book_new();



    XLSX.utils.book_append_sheet(

        wb,

        ws,

        "장기지연결과"

    );



    XLSX.writeFile(

        wb,

        "장기지연_결과_V63.xlsx"

    );

}







// ===============================
// 날짜 셀 안정화 함수
// ===============================


function setDateCell(ws,cellAddress,value){


    let cell =
    ws[cellAddress];



    if(!cell)
        return;




    // 날짜 객체

    if(
        value instanceof Date
        &&
        !isNaN(value.getTime())
    ){


        cell.t="d";

        cell.v=value;

        cell.z="yyyy-mm-dd";


        return;

    }





    // 날짜 문자열

    let d =
    safeDate(value);



    if(d){


        cell.t="d";

        cell.v=d;

        cell.z="yyyy-mm-dd";


        return;


    }





    // 문자 유지

    cell.t="s";

    cell.v=value || "";



}







</script>


</body>

</html>
