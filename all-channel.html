<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>포레스트핏 장기지연 납기 자동 시스템 V11</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{font-family:Arial;background:#FFF9E8;margin:0;color:#4A3A12}
.wrap{max-width:1200px;margin:auto;padding:30px}

h1{color:#6B5310}

.card{
  background:#FFFDF7;
  border:1px solid #E7D8A3;
  border-radius:12px;
  padding:18px;
  margin-bottom:15px;
}

input,textarea{
  width:100%;
  padding:10px;
  margin-top:6px;
  margin-bottom:12px;
  border:1px solid #465163;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#C9A227;
  font-weight:bold;
  cursor:pointer;
}

.small{font-size:12px;color:#777}
</style>
</head>

<body>

<div class="wrap">

<h1>포레스트핏 장기지연 납기 자동 시스템 V11</h1>

<div class="card">
<label>1. 셀메이트 파일</label>
<input type="file" id="file1">
</div>

<div class="card">
<label>2. 브리치 파일</label>
<input type="file" id="file2">
</div>

<div class="card">
<label>공휴일</label>
<textarea id="holiday"></textarea>
</div>

<div class="card">
<button onclick="run()">계산 실행</button>
<button onclick="downloadExcel()">결과 다운로드</button>
</div>

<div id="status"></div>

</div>

<script>

let wb1, wb2;
let result = [];

/* =========================
   🔥 날짜 변환 (완전 통합)
========================= */
function excelDate(v){

  if(!v) return "";

  // 이미 Date
  if(v instanceof Date){
    return formatDate(v);
  }

  // 엑셀 숫자 날짜
  if(typeof v === "number"){
    const d = new Date((v - 25569) * 86400 * 1000);
    return formatDate(d);
  }

  // 문자열
  const d = new Date(v);
  if(!isNaN(d)){
    return formatDate(d);
  }

  return v;
}

function formatDate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}

/* =========================
   브리치 옵션
========================= */
function cleanOption(v){
  if(!v) return "";
  return String(v)
    .replace(/\s/g,"")
    .replace(/\//g,",")
    .replace(/_/g,"")
    .replace(/기본옵션:옵션/g,"")
    .replace(/-/g,"")
    .replace(/[A-Za-z]+\d+/g,"");
}

function extractBracket(v){
  const m = String(v||"").match(/\(([^()]*)\)/);
  return m ? m[1] : "";
}

/* =========================
   브리치 MAP
========================= */
function buildBrichMap(rows){

  const map = new Map();

  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r) continue;

    const key = r[1] + "|" + extractBracket(r[6]) + "|" + cleanOption(r[11]);

    map.set(key, r[19]);
  }

  return map;
}

/* =========================
   실행
========================= */
document.getElementById("file1").onchange = async (e)=>{
  wb1 = XLSX.read(await e.target.files[0].arrayBuffer(), {type:"array"});
}

document.getElementById("file2").onchange = async (e)=>{
  wb2 = XLSX.read(await e.target.files[0].arrayBuffer(), {type:"array"});
}

function run(){

if(!wb1 || !wb2){
  alert("파일 2개 필요");
  return;
}

const data1 = XLSX.utils.sheet_to_json(wb1.Sheets[wb1.SheetNames[0]], {
  header:1,
  defval:""
});

const data2 = XLSX.utils.sheet_to_json(wb2.Sheets[wb2.SheetNames[0]], {
  header:1,
  defval:""
});

const brichMap = buildBrichMap(data2);

result = [];

for(let i=1;i<data1.length;i++){

  const r = data1[i];
  if(!r) continue;

  const key = r[3] + "|" + extractBracket(r[10]) + "|" + cleanOption(r[7]);

  let shipDate = brichMap.get(key);

  if(!shipDate){
    shipDate = r[8];
  }

  result.push([
    excelDate(r[0]),   // ✔ A열
    r[1],
    r[2],
    r[3],
    r[4],
    r[5],
    r[6],
    r[7],
    excelDate(r[8]),   // ✔ I열
    excelDate(shipDate), // ✔ J열 (핵심 수정)
    r[10] || "",
    r[11] || ""
  ]);
}

document.getElementById("status").innerText =
"완료 : " + result.length + "건";

}

/* =========================
   다운로드
========================= */
function downloadExcel(){

if(!result.length){
  alert("결과 없음");
  return;
}

const ws = XLSX.utils.aoa_to_sheet([
[
"주문일자","지연일","판매처명","주문번호",
"공급처명","사입상품명","판매처상품명","옵션",
"입고예정일","출고준수일","출고불가","진행상황"
],
...result
]);

const wb = XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb, ws, "result");

const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});

const blob = new Blob([wbout], {type:"application/octet-stream"});
const url = URL.createObjectURL(blob);

const a = document.createElement("a");
a.href = url;
a.download = "장기지연_결과_V11.xlsx";
document.body.appendChild(a);
a.click();
document.body.removeChild(a);

URL.revokeObjectURL(url);

}

</script>

</body>
</html>
