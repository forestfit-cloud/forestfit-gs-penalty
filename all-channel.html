<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>포레스트핏 장기지연 납기 비교 시스템 V2</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{font-family:Arial;background:#FFF9E8;margin:0;color:#4A3A12}
.wrap{max-width:1200px;margin:auto;padding:30px}

h1{color:#6B5310}
.desc{color:#7A7A7A;margin-bottom:20px}

.card{
  background:#FFFDF7;
  border:1px solid #E7D8A3;
  border-radius:12px;
  padding:18px;
  margin-bottom:15px;
}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}

input,textarea{
  width:100%;
  padding:10px;
  margin-top:6px;
  margin-bottom:12px;
  border:1px solid #465163;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#C9A227;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

button:hover{opacity:0.9}

.small{font-size:12px;color:#777}
</style>
</head>

<body>

<div class="wrap">

<h1>포레스트핏 장기지연 납기 비교 시스템 V2</h1>

<div class="desc">
셀메이트 / 브리치 파일을 비교하여 자동으로 납기 및 출고 상태를 정리합니다.
</div>

<div class="grid">

<div class="card">
<label>1. 셀메이트 파일</label>
<input type="file" id="file1"/>
<div class="small">장기지연건 파일 업로드</div>
</div>

<div class="card">
<label>2. 브리치 파일</label>
<input type="file" id="file2"/>
<div class="small">배송준비 / 배송지연 파일</div>
</div>

</div>

<div class="card">
<label>공휴일 입력</label>
<textarea id="holiday"></textarea>
</div>

<div class="card">
<button onclick="run()">계산 실행</button>
<button onclick="downloadExcel()">결과 다운로드</button>
</div>

<div class="card">
<div id="status"></div>
</div>

</div>

<script>

let wb1, wb2;
let result = [];

/* 파일 로딩 */
document.getElementById("file1").onchange = async (e)=>{
  wb1 = XLSX.read(await e.target.files[0].arrayBuffer(), {type:"array"});
}

document.getElementById("file2").onchange = async (e)=>{
  wb2 = XLSX.read(await e.target.files[0].arrayBuffer(), {type:"array"});
}

/* ======================
   계산
====================== */
function run(){

if(!wb1){
  alert("셀메이트 파일 필요");
  return;
}

const sheet = wb1.SheetNames[0];
const data = XLSX.utils.sheet_to_json(wb1.Sheets[sheet], {
  header:1,
  defval:""
});

result = [];

for(let i=1;i<data.length;i++){
  const r = data[i];
  if(!r) continue;

  result.push([
    r[0],
    r[1],
    r[2],
    r[3],
    r[4],
    r[5],
    r[6],
    r[7],
    r[8],
    r[9]||"",
    r[10]||"",
    r[11]||""
  ]);
}

document.getElementById("status").innerText =
"완료 : " + result.length + "건";
}

/* ======================
   다운로드 (V2 안정 Blob)
====================== */
function downloadExcel(){

if(!result.length){
  alert("결과 없음");
  return;
}

const ws = XLSX.utils.aoa_to_sheet([
[
"주문일자","지연일","판매처명","주문번호",
"공급처명","사입상품명","판매처상품명","옵션",
"입고예정일","출고준수일","출고불가","진행상황"
],
...result
]);

const wb = XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb, ws, "result");

const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});

const blob = new Blob([wbout], {
  type:"application/octet-stream"
});

const url = URL.createObjectURL(blob);

const a = document.createElement("a");
a.href = url;
a.download = "장기지연_결과_V2.xlsx";
document.body.appendChild(a);
a.click();
document.body.removeChild(a);

URL.revokeObjectURL(url);

}

</script>

</body>
</html>
