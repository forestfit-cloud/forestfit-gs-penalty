<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>포레스트핏 입고/납기 자동 비교 (Stable)</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{font-family:Arial,"Noto Sans KR",sans-serif;margin:0;background:#fff9e8;color:#4a3a12}
.wrap{max-width:1200px;margin:auto;padding:24px}
h1{font-size:24px}
.card{background:#fff;border:1px solid #e7d8a3;padding:16px;border-radius:12px;margin-bottom:14px}
input,select,button{width:100%;padding:10px;margin-top:8px}
button{background:#c9a227;border:0;color:#fff;font-weight:bold;cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border:1px solid #ddd;padding:6px;text-align:center}
th{background:#eee;position:sticky;top:0}
</style>
</head>

<body>
<div class="wrap">

<h1>입고/납기 자동 비교 (Stable Version)</h1>

<div class="card">
<label>셀메이트 파일</label>
<input type="file" id="todayFile">
<select id="todaySheet"></select>
</div>

<div class="card">
<label>브리치 파일</label>
<input type="file" id="brichFile">
<select id="brichSheet"></select>
</div>

<div class="card">
<button onclick="run()">계산 실행</button>
</div>

<div class="card">
<div id="summary"></div>
<div id="table"></div>
</div>

</div>

<script>
let todayWB=null, brichWB=null, result=[];

/* =========================
   자동 컬럼 매핑 (핵심)
========================= */
function detectMap(rows){
  const header = rows[0] || [];

  const find = (keys)=>{
    for(let i=0;i<header.length;i++){
      const h = String(header[i]||"").toLowerCase();
      if(keys.some(k=>h.includes(k))) return i;
    }
    return -1;
  };

  return {
    orderNo: find(["주문번호","order"]),
    product: find(["상품","product"]),
    option: find(["옵션","option"]),
    seller: find(["판매처","channel"]),
    inbound: find(["입고","예정"])
  };
}

/* =========================
   File Load (안정형)
========================= */
function loadFile(input, wbSetter, sheetId){
  const file = input.files[0];
  if(!file) return;

  const reader = new FileReader();

  reader.onload = e=>{
    const data = new Uint8Array(e.target.result);
    const wb = XLSX.read(data,{type:"array"});

    wbSetter(wb);

    const sel = document.getElementById(sheetId);
    sel.innerHTML="";
    wb.SheetNames.forEach(s=>sel.add(new Option(s,s)));
    sel.value=wb.SheetNames[0];
  };

  reader.readAsArrayBuffer(file);
}

/* =========================
   Utils
========================= */
const norm = v => String(v||"").replace(/\s+/g,"");

function key(r,m){
  return norm(r[m.orderNo])+"||"+norm(r[m.product])+"||"+norm(r[m.option]);
}

/* =========================
   MAIN
========================= */
function run(){

  if(!todayWB){
    alert("셀메이트 파일 업로드 필요");
    return;
  }

  const todayRows = XLSX.utils.sheet_to_json(
    todayWB.Sheets[document.getElementById("todaySheet").value],
    {header:1,defval:""}
  );

  const brichRows = brichWB ? XLSX.utils.sheet_to_json(
    brichWB.Sheets[document.getElementById("brichSheet").value],
    {header:1,defval:""}
  ) : [];

  const m = detectMap(todayRows);

  if(m.orderNo===-1){
    alert("컬럼 자동 인식 실패 (헤더 확인 필요)");
    return;
  }

  const map = new Map();

  for(let i=1;i<todayRows.length;i++){
    const r=todayRows[i];
    if(!r) continue;
    map.set(key(r,m), r);
  }

  result = [["주문번호","상품","옵션","판매처","입고","상태"]];

  for(let i=1;i<todayRows.length;i++){
    const r=todayRows[i];

    const k = key(r,m);
    const matched = map.get(k);

    const status = matched ? "" : "미매칭";

    result.push([
      r[m.orderNo],
      r[m.product],
      r[m.option],
      r[m.seller],
      r[m.inbound],
      status
    ]);
  }

  render();
}

/* =========================
   Render
========================= */
function render(){
  let h="<table><tr>";
  result[0].forEach(x=>h+=`<th>${x}</th>`);
  h+="</tr>";

  for(let i=1;i<result.length;i++){
    h+="<tr>";
    result[i].forEach(x=>h+=`<td>${x||""}</td>`);
    h+="</tr>";
  }

  h+="</table>";

  document.getElementById("table").innerHTML=h;
  document.getElementById("summary").innerText="총 "+(result.length-1)+"건";
}

/* =========================
   EVENTS
========================= */
document.getElementById("todayFile")
.addEventListener("change",e=>{
  loadFile(e.target,v=>todayWB=v,"todaySheet");
});

document.getElementById("brichFile")
.addEventListener("change",e=>{
  loadFile(e.target,v=>brichWB=v,"brichSheet");
});
</script>

</body>
</html>
