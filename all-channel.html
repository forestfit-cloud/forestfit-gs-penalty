<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>포레스트핏 납기 자동 시스템 V12</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{font-family:Arial;background:#FFF9E8;margin:0;color:#4A3A12}
.wrap{max-width:1200px;margin:auto;padding:30px}
h1{color:#6B5310}
.card{background:#FFFDF7;border:1px solid #E7D8A3;border-radius:12px;padding:18px;margin-bottom:15px}
input,textarea{width:100%;padding:10px;margin-top:6px;margin-bottom:12px;border:1px solid #465163;border-radius:8px}
button{width:100%;padding:12px;border:none;border-radius:8px;background:#C9A227;font-weight:bold}
.small{font-size:12px;color:#777}
</style>
</head>

<body>

<div class="wrap">

<h1>포레스트핏 납기 자동 시스템 V12</h1>

<div class="card">
<label>1. 셀메이트 파일</label>
<input type="file" id="file1">
</div>

<div class="card">
<label>2. 브리치 파일</label>
<input type="file" id="file2">
</div>

<div class="card">
<label>공휴일</label>
<textarea id="holiday"></textarea>
</div>

<div class="card">
<button onclick="run()">계산 실행</button>
<button onclick="downloadExcel()">결과 다운로드</button>
</div>

<div id="status"></div>

</div>

<script>

let wb1, wb2;
let result = [];

/* =========================
   공휴일
========================= */
function getHolidays(){
  return document.getElementById("holiday").value
    .split("\n")
    .map(v=>v.trim())
    .filter(Boolean);
}

function isWeekend(d){
  return d.getDay() === 0 || d.getDay() === 6;
}

function isHoliday(d, holidays){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return holidays.includes(`${y}-${m}-${dd}`);
}

/* =========================
   영업일 계산
========================= */
function addWorkDays(date, days, holidays){
  let cur = new Date(date);
  let count = 0;

  while(count < days){
    cur.setDate(cur.getDate()+1);
    if(!isWeekend(cur) && !isHoliday(cur, holidays)){
      count++;
    }
  }
  return cur;
}

/* =========================
   +1 month
========================= */
function addMonth(date, m){
  const d = new Date(date);
  d.setMonth(d.getMonth()+m);
  return d;
}

/* =========================
   J열 핵심 로직
========================= */
function calcShipDate(date, seller, holidays){

  if(!date) return "";

  // 퀸잇
  if(seller === "퀸잇"){
    return addWorkDays(date, 21, holidays);
  }

  // 하프클럽
  if(seller === "하프클럽"){
    return addWorkDays(date, 15, holidays);
  }

  // 네이버 / 롯데ON
  if(seller === "네이버 스마트스토어" || seller === "롯데ON"){
    return addMonth(date, 1);
  }

  return date;
}

/* =========================
   날짜 변환
========================= */
function excelDate(v){

  if(!v) return "";

  if(v instanceof Date){
    return v;
  }

  if(typeof v === "number"){
    return new Date((v - 25569) * 86400 * 1000);
  }

  const d = new Date(v);
  return isNaN(d) ? v : d;
}

/* =========================
   RUN
========================= */
document.getElementById("file1").onchange = async (e)=>{
  wb1 = XLSX.read(await e.target.files[0].arrayBuffer(), {type:"array"});
}

document.getElementById("file2").onchange = async (e)=>{
  wb2 = XLSX.read(await e.target.files[0].arrayBuffer(), {type:"array"});
}

function run(){

if(!wb1){
  alert("파일 필요");
  return;
}

const holidays = getHolidays();

const data = XLSX.utils.sheet_to_json(wb1.Sheets[wb1.SheetNames[0]], {
  header:1,
  defval:""
});

result = [];

for(let i=1;i<data.length;i++){

  const r = data[i];
  if(!r) continue;

  const orderDate = excelDate(r[0]);
  const seller = r[2];

  const shipDate = calcShipDate(orderDate, seller, holidays);

  result.push([
    r[0], r[1], r[2], r[3],
    r[4], r[5], r[6], r[7],
    r[8],
    shipDate,
    r[10] || "",
    r[11] || ""
  ]);
}

document.getElementById("status").innerText =
"완료 : " + result.length + "건";

}

/* =========================
   다운로드
========================= */
function downloadExcel(){

const ws = XLSX.utils.aoa_to_sheet([
[
"주문일자","지연일","판매처명","주문번호",
"공급처명","사입상품명","판매처상품명","옵션",
"입고예정일","출고준수일","출고불가","진행상황"
],
...result
]);

const wb = XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb, ws, "result");

XLSX.writeFile(wb, "납기계산_V12.xlsx");
}

</script>

</body>
</html>
