<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>장기지연 납기 자동 비교</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{
  font-family:Arial;
  background:#FFF9E8;
  margin:0;
  color:#4A3A12;
}
.wrap{max-width:1200px;margin:0 auto;padding:30px}

h1{font-size:26px;margin-bottom:10px;color:#6B5310}
.desc{color:#7A6640;margin-bottom:20px}

.card{
  background:#FFFDF7;
  border:1px solid #E7D8A3;
  border-radius:12px;
  padding:18px;
  margin-bottom:15px;
}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}

label{font-weight:bold;font-size:14px;color:#6B5310}

input,select,textarea{
  width:100%;
  padding:10px;
  margin-top:6px;
  margin-bottom:12px;
  border:1px solid #465163;
  border-radius:8px;
}

button{
  padding:12px;
  border:none;
  border-radius:8px;
  background:#C9A227;
  font-weight:bold;
  cursor:pointer;
  width:100%;
  margin-top:10px;
}

button:hover{opacity:0.9}

.small{font-size:12px;color:#777;line-height:1.5}
</style>
</head>

<body>

<div class="wrap">

<h1>포레스트핏 장기지연 납기 비교 시스템</h1>

<div class="desc">
셀메이트 + 브리치 파일을 비교하여 납기 및 출고 상태를 자동 정리합니다.
</div>

<!-- 업로드 -->
<div class="grid">

<div class="card">
<label>1. 셀메이트 장기지연 파일</label>
<input type="file" id="file1" />
<div class="small">
셀메이트 → 주문관리 → 장기지연건 다운로드 파일 업로드
</div>
</div>

<div class="card">
<label>2. 브리치 배송 파일</label>
<input type="file" id="file2" />
<div class="small">
배송준비 / 배송지연 파일 업로드
</div>
</div>

</div>

<!-- 공휴일 -->
<div class="card">
<label>공휴일 입력</label>
<textarea id="holiday" placeholder="2026-01-01"></textarea>
</div>

<!-- 실행 -->
<div class="card">
<button onclick="run()">계산 실행</button>
<button onclick="downloadExcel()">결과 다운로드</button>
</div>

<!-- 결과 -->
<div class="card">
<div id="status"></div>
</div>

</div>

<script>

let result = [];
let wb1, wb2;

/* ======================
   파일 읽기
====================== */
document.getElementById("file1").onchange = async (e)=>{
  wb1 = XLSX.read(await e.target.files[0].arrayBuffer(), {type:"array"});
}

document.getElementById("file2").onchange = async (e)=>{
  wb2 = XLSX.read(await e.target.files[0].arrayBuffer(), {type:"array"});
}

/* ======================
   계산
====================== */
function run(){

if(!wb1) return alert("셀메이트 파일 업로드 필요");

const sheet = wb1.SheetNames[0];
const data = XLSX.utils.sheet_to_json(wb1.Sheets[sheet], {header:1});

result = [];

for(let i=1;i<data.length;i++){
const r = data[i];

if(!r) continue;

result.push([
  r[0], // 주문일자
  r[1], // 지연일
  r[2], // 판매처명
  r[3], // 주문번호
  r[4], // 공급처명
  r[5], // 사입상품명
  r[6], // 판매처상품명
  r[7], // 옵션
  r[8], // 입고예정일
  r[9] || "", // 출고준수일
  r[10] || "", // 출고불가
  r[11] || ""  // 진행상황
]);

}

document.getElementById("status").innerText =
"계산 완료 : " + result.length + "건";
}

/* ======================
   다운로드
====================== */
function downloadExcel(){

if(result.length === 0){
  alert("결과 없음");
  return;
}

const ws = XLSX.utils.aoa_to_sheet([
[
"주문일자","지연일","판매처명","주문번호",
"공급처명","사입상품명","판매처상품명","옵션",
"입고예정일","출고준수일","출고불가","진행상황"
],
...result
]);

const wb = XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb, ws, "result");

/* 필터 */
ws['!autofilter'] = { ref: XLSX.utils.encode_range(ws['!ref']) };

/* 컬럼 넓이 */
ws['!cols'] = Array(12).fill({wch:18});

XLSX.writeFile(wb, "장기지연_결과.xlsx");
}

</script>

</body>
</html>
