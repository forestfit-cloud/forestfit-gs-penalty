<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>포레스트핏 납기 V21 STABLE CORE</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{font-family:Arial;background:#FFF9E8;margin:0}
.wrap{max-width:1200px;margin:auto;padding:30px}
.card{background:#fff;border:1px solid #ddd;padding:12px;margin-bottom:10px}
button{width:100%;padding:10px;background:#C9A227;border:0;font-weight:bold}
h2{margin-bottom:15px}
</style>
</head>

<body>

<div class="wrap">

<h2>V21 STABLE FIX CORE</h2>

<div class="card">
<input type="file" id="file1">
</div>

<div class="card">
<input type="file" id="file2">
</div>

<div class="card">
<textarea id="holiday"></textarea>
</div>

<div class="card">
<button onclick="run()">계산 실행</button>
<button onclick="downloadExcel()">다운로드</button>
</div>

<div id="status"></div>

</div>

<script>

let wb1, wb2;
let result = [];

/* =========================
   날짜 안전 변환
========================= */
function fixDate(v){
  if(!v) return "";

  if(typeof v === "number"){
    return fmt(new Date((v - 25569) * 86400 * 1000));
  }

  const d = new Date(v);
  return isNaN(d) ? "" : fmt(d);
}

function fmt(d){
  return d.getFullYear()+"-"+
  String(d.getMonth()+1).padStart(2,"0")+"-"+
  String(d.getDate()).padStart(2,"0");
}

/* =========================
   안전 index getter
========================= */
function safe(row, idx){
  return (row && row[idx]) ? row[idx] : "";
}

/* =========================
   옵션 정리
========================= */
function opt(v){
  return String(v||"")
    .replace(/\s/g,"")
    .replace(/\//g,",")
    .replace(/_/g,"")
    .replace(/-/g,"")
    .replace(/[A-Za-z]+\d+/g,"");
}

/* =========================
   괄호 추출
========================= */
function bracket(v){
  const m=String(v||"").match(/\(([^()]*)\)/);
  return m?m[1]:"";
}

/* =========================
   RUN
========================= */
document.getElementById("file1").onchange=async(e)=>{
  wb1=XLSX.read(await e.target.files[0].arrayBuffer(),{type:"array"});
}

document.getElementById("file2").onchange=async(e)=>{
  wb2=XLSX.read(await e.target.files[0].arrayBuffer(),{type:"array"});
}

function run(){

const d1=XLSX.utils.sheet_to_json(wb1.Sheets[wb1.SheetNames[0]],{header:1,defval:""});
const d2=XLSX.utils.sheet_to_json(wb2.Sheets[wb2.SheetNames[0]],{header:1,defval:""});

const map=new Map();

/* =========================
   BRICH MAP (안전 index)
========================= */
for(let i=1;i<d2.length;i++){
  const r=d2[i];
  if(!r) continue;

  const k =
    safe(r,1) + "|" +              // 주문번호
    bracket(safe(r,6)) + "|" +     // 상품
    opt(safe(r,11));               // 옵션

  map.set(k, safe(r,19)); // T
}

result=[];

/* =========================
   MAIN LOOP (완전 안정형)
========================= */
for(let i=1;i<d1.length;i++){

  const r=d1[i];
  if(!r) continue;

  const seller = safe(r,2);
  const orderDate = fixDate(safe(r,0));

  let j = "";

  if(seller === "비플로우"){

    const k =
      safe(r,3) + "|" +
      bracket(safe(r,5)) + "|" +
      opt(safe(r,7));

    j = map.get(k) || "";
  }

  result.push([
    orderDate,
    "",
    seller,
    safe(r,3),
    "",
    safe(r,5),
    safe(r,6),
    safe(r,7),
    "",
    j ? fixDate(j) : "",
    "",
    ""
  ]);
}

document.getElementById("status").innerText =
"완료: " + result.length + "건";

}

/* =========================
   DOWNLOAD
========================= */
function downloadExcel(){

const ws=XLSX.utils.aoa_to_sheet(result);
const wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"result");

XLSX.writeFile(wb,"V21_STABLE_FINAL.xlsx");
}

</script>

</body>
</html>
