<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>포레스트핏 납기 V24 FINAL FIX</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{font-family:Arial;background:#FFF9E8;margin:0}
.wrap{max-width:1200px;margin:auto;padding:30px}
.card{background:#fff;border:1px solid #ddd;padding:12px;margin-bottom:10px}
button{width:100%;padding:10px;background:#C9A227;border:0;font-weight:bold}
</style>
</head>

<body>

<div class="wrap">

<h2>V24 FINAL NO EMPTY J</h2>

<div class="card">
<input type="file" id="file1">
</div>

<div class="card">
<input type="file" id="file2">
</div>

<div class="card">
<textarea id="holiday"></textarea>
</div>

<div class="card">
<button onclick="run()">계산 실행</button>
<button onclick="downloadExcel()">다운로드</button>
</div>

<div id="status"></div>

</div>

<script>

let wb1, wb2;
let result = [];

/* =========================
   날짜 변환
========================= */
function fmt(d){
  return d.getFullYear()+"-"+
  String(d.getMonth()+1).padStart(2,"0")+"-"+
  String(d.getDate()).padStart(2,"0");
}

function toDate(v){
  if(!v) return null;
  if(typeof v==="number"){
    return new Date((v-25569)*86400*1000);
  }
  const d=new Date(v);
  return isNaN(d)?null:d;
}

/* =========================
   옵션 정리
========================= */
function opt(v){
  return String(v||"")
    .replace(/\s/g,"")
    .replace(/\//g,",")
    .replace(/_/g,"")
    .replace(/-/g,"")
    .replace(/[A-Za-z]+\d+/g,"")
    .trim();
}

function bracket(v){
  const m=String(v||"").match(/\(([^()]*)\)/);
  return m?m[1]:"";
}

/* =========================
   KEY
========================= */
function key(a,b,c){
  return a+"|"+b+"|"+c;
}

/* =========================
   RUN
========================= */
document.getElementById("file1").onchange=async(e)=>{
  wb1=XLSX.read(await e.target.files[0].arrayBuffer(),{type:"array"});
}

document.getElementById("file2").onchange=async(e)=>{
  wb2=XLSX.read(await e.target.files[0].arrayBuffer(),{type:"array"});
}

function run(){

const d1=XLSX.utils.sheet_to_json(wb1.Sheets[wb1.SheetNames[0]],{header:1,defval:""});
const d2=XLSX.utils.sheet_to_json(wb2.Sheets[wb2.SheetNames[0]],{header:1,defval:""});

/* =========================
   브리치 MAP
========================= */
const map=new Map();

for(let i=1;i<d2.length;i++){
  const r=d2[i];
  if(!r) continue;

  const k=key(
    r[1],
    bracket(r[10]),
    opt(r[11])
  );

  map.set(k,r[19]);
}

result=[];

/* =========================
   MAIN LOOP (J 무조건 채움)
========================= */
for(let i=1;i<d1.length;i++){

  const r=d1[i];
  if(!r) continue;

  const seller=r[2];
  const orderDate=toDate(r[0]);

  let j="";

  /* 🔵 STEP 1: 비플로우 */
  if(seller==="비플로우"){

    const k=key(
      r[3],
      bracket(r[6]),
      opt(r[7])
    );

    j=map.get(k)||"";
  }

  /* 🔵 STEP 2: 퀸잇 */
  if(!j && seller.includes("퀸잇") && orderDate){
    const d=new Date(orderDate);
    d.setDate(d.getDate()+21);
    j=fmt(d);
  }

  /* 🔵 STEP 3: 하프클럽 */
  if(!j && seller.includes("하프클럽") && orderDate){
    const d=new Date(orderDate);
    d.setDate(d.getDate()+15);
    j=fmt(d);
  }

  /* 🔵 STEP 4: 네이버/롯데ON */
  if(!j && (seller.includes("네이버") || seller.includes("롯데ON")) && orderDate){
    const d=new Date(orderDate);
    d.setMonth(d.getMonth()+1);
    j=fmt(d);
  }

  /* 🔵 STEP 5: 최후 fallback (절대 빈칸 방지) */
  if(!j){
    j = orderDate ? fmt(orderDate) : "데이터없음";
  }

  result.push([
    r[0],r[1],r[2],r[3],
    r[4],r[5],r[6],r[7],
    r[8],
    j,
    r[10],r[11]
  ]);
}

document.getElementById("status").innerText=
"완료:"+result.length+"건";

}

/* =========================
   DOWNLOAD
========================= */
function downloadExcel(){

const ws=XLSX.utils.aoa_to_sheet(result);
const wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"result");

XLSX.writeFile(wb,"V24_NO_EMPTY_J.xlsx");
}

</script>

</body>
</html>
