<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>포레스트핏 납기 시스템 V13 (FIX)</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{font-family:Arial;background:#FFF9E8;margin:0;color:#4A3A12}
.wrap{max-width:1200px;margin:auto;padding:30px}
h1{color:#6B5310}
.card{background:#FFFDF7;border:1px solid #E7D8A3;border-radius:12px;padding:18px;margin-bottom:15px}
input,textarea{width:100%;padding:10px;margin-top:6px;margin-bottom:12px;border:1px solid #465163;border-radius:8px}
button{width:100%;padding:12px;border:none;border-radius:8px;background:#C9A227;font-weight:bold}
.small{font-size:12px;color:#777}
</style>
</head>

<body>

<div class="wrap">

<h1>포레스트핏 납기 시스템 V13 (FIX)</h1>

<div class="card">
<label>1. 셀메이트</label>
<input type="file" id="file1">
</div>

<div class="card">
<label>2. 브리치</label>
<input type="file" id="file2">
</div>

<div class="card">
<label>공휴일</label>
<textarea id="holiday"></textarea>
</div>

<div class="card">
<button onclick="run()">계산 실행</button>
<button onclick="downloadExcel()">다운로드</button>
</div>

<div id="status"></div>

</div>

<script>

let wb1, wb2;
let result = [];

/* =========================
   🔥 핵심: 날짜 강제 변환 FIX
========================= */
function fixDate(v){

  if(!v) return "";

  // Excel serial number
  if(typeof v === "number"){
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    return format(d);
  }

  // Date object
  if(v instanceof Date){
    return format(v);
  }

  // string
  const d = new Date(v);
  if(!isNaN(d)) return format(d);

  return v;
}

function format(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}

/* =========================
   브리치 KEY FIX
========================= */
function extractBracket(v){
  const m = String(v||"").match(/\(([^()]*)\)/);
  return m ? m[1] : "";
}

function cleanOption(v){
  return String(v||"")
    .replace(/\s/g,"")
    .replace(/\//g,",")
    .replace(/_/g,"")
    .replace(/-/g,"")
    .replace(/[A-Za-z]+\d+/g,"");
}

function makeKey(order, product, option){
  return String(order).trim() + "|" +
         String(product).trim() + "|" +
         String(option).trim();
}

/* =========================
   BRICH MAP
========================= */
function buildMap(rows){

  const map = new Map();

  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r) continue;

    const key = makeKey(
      r[1],
      extractBracket(r[6]),
      cleanOption(r[11])
    );

    map.set(key, r[19]);
  }

  return map;
}

/* =========================
   RUN
========================= */
document.getElementById("file1").onchange = async (e)=>{
  wb1 = XLSX.read(await e.target.files[0].arrayBuffer(), {type:"array"});
}

document.getElementById("file2").onchange = async (e)=>{
  wb2 = XLSX.read(await e.target.files[0].arrayBuffer(), {type:"array"});
}

function run(){

if(!wb1 || !wb2){
  alert("파일 필요");
  return;
}

const data1 = XLSX.utils.sheet_to_json(wb1.Sheets[wb1.SheetNames[0]], {
  header:1,
  defval:""
});

const data2 = XLSX.utils.sheet_to_json(wb2.Sheets[wb2.SheetNames[0]], {
  header:1,
  defval:""
});

const map = buildMap(data2);

result = [];

for(let i=1;i<data1.length;i++){

  const r = data1[i];
  if(!r) continue;

  const key = makeKey(
    r[3],
    extractBracket(r[10]),
    cleanOption(r[7])
  );

  let ship = map.get(key);

  if(!ship){
    ship = r[8];
  }

  result.push([
    fixDate(r[0]),   // A
    r[1],
    r[2],
    r[3],
    r[4],
    r[5],
    r[6],
    r[7],
    fixDate(r[8]),   // I
    fixDate(ship),   // J
    r[10] || "",
    r[11] || ""
  ]);
}

document.getElementById("status").innerText =
"완료 : " + result.length + "건";

}

/* =========================
   DOWNLOAD
========================= */
function downloadExcel(){

const ws = XLSX.utils.aoa_to_sheet([
[
"주문일자","지연일","판매처명","주문번호",
"공급처명","사입상품명","판매처상품명","옵션",
"입고예정일","출고준수일","출고불가","진행상황"
],
...result
]);

const wb = XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb, ws, "result");

XLSX.writeFile(wb, "납기_V13_FIX.xlsx");
}

</script>

</body>
</html>
