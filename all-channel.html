<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>포레스트핏 장기지연건 입고/납기 자동 비교</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{font-family:Arial,"Noto Sans KR",sans-serif;margin:0;background:#FFF9E8;color:#4A3A12}
.wrap{max-width:1280px;margin:0 auto;padding:30px}
h1{font-size:28px;margin:0 0 8px;color:#6B5310}
.desc{color:#7A6640;line-height:1.5;margin-bottom:22px}

.card{background:#FFFDF7;border:1px solid #E7D8A3;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}

label{display:block;font-weight:bold;margin-bottom:8px;color:#6B5310}

input,select,textarea,button{
width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #465163;border-radius:10px;font-size:14px;margin-bottom:12px;background:#FFFFFF;color:#4A3A12
}

textarea{min-height:96px;resize:vertical}

button{cursor:pointer;border:0;background:#C9A227;color:#6B5310;font-weight:bold}
button.secondary{background:#BFA45A;color:#FFFFFF}

.table-wrap{max-height:560px;overflow:auto;border:1px solid #394150;border-radius:12px;background:#fff;color:#222}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border:1px solid #d9d9d9;padding:7px;white-space:nowrap;text-align:center;vertical-align:middle}
th{background:#d9d9d9;position:sticky;top:0}
</style>
</head>

<body>
<div class="wrap">

<h1>포레스트핏 장기지연건 입고/납기 자동 비교</h1>

<div class="desc">
처음 사용하는 경우, 각 업로드 영역 아래의 <b>첨부 파일 다운로드 방법</b>을 순서대로 따라 파일을 다운로드한 뒤 첨부해 주세요.<br>
기존 파일과 오늘 파일을 비교하여 입고예정일 변경 여부를 확인하고, 브리치 파일을 함께 업로드하면 비플로우 건의 출고준수일을 보정합니다.
</div>

<div class="grid3">

<!-- ✅ 1번 선택 업로드 완전 삭제됨 -->

<!-- TODAY -->
<div class="card">
<label>1. 셀메이트 파일 업로드</label>
<input type="file" id="todayFile"/>
<select id="todaySheet"></select>
</div>

<!-- BRICH -->
<div class="card">
<label>2. 브리치 다운 파일 업로드</label>
<input type="file" id="brichFile"/>
<select id="brichSheet"></select>
</div>

</div>

<div class="card">
<label>4. 공휴일 입력</label>
<textarea id="holidays" placeholder="2026-05-25"></textarea>
</div>

<div class="card">
<button onclick="processFiles()">계산 실행</button>
<button class="secondary" onclick="downloadResult()">결과 엑셀 다운로드</button>
</div>

<div class="card">
<div id="summary"></div>
<div class="table-wrap" id="tableWrap"></div>
</div>

</div>

<script>
let baseWorkbook=null,todayWorkbook=null,brichWorkbook=null,resultRows=[];

/* ===== 이하 JS는 그대로 유지 (수정 없음) ===== */

const OUT_HEADERS=[
"주문일자","지연일","판매처명","주문번호","공급처명",
"사입상품명","판매처상품명","옵션",
"입고예정일","변경입고예정일","지연일수","지연여부",
"출고준수일","출고불가","진행상황"
];

const SRC={
ORDER_DATE:0,DELAY:1,SELLER:2,ORDER_NO:3,SUPPLIER:4,
BUY_NAME:5,PRODUCT:6,OPTION:7,OLD_INBOUND:8
};

const BR={ORDER_NO:1,PRODUCT:10,SHIP_DATE:19};

function txt(v){return v==null?"":String(v).trim()}
function norm(v){return txt(v).replace(/\u00A0/g," ").replace(/\s+/g,"").replace(/，/g,",").trim()}
function srcKey(row){return norm(row[SRC.ORDER_NO])+"||"+norm(row[SRC.PRODUCT])+"||"+norm(row[SRC.OPTION])}

function toDate(v){
if(v==null||v==="")return null;
if(v instanceof Date) return new Date(v);
let d=new Date(v);
return isNaN(d)?null:d;
}

function getRows(wb,sheet){
return XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,raw:false,defval:""});
}

function fillSelect(wb,id){
const s=document.getElementById(id);
s.innerHTML="";
wb.SheetNames.forEach(n=>s.add(new Option(n,n)));
s.value=wb.SheetNames[0];
}

function buildTodayMap(rows){
const map=new Map();
for(let i=1;i<rows.length;i++){
const r=rows[i]||[];
if(!norm(r[SRC.ORDER_NO]))continue;
map.set(srcKey(r),r[SRC.OLD_INBOUND]);
}
return map;
}

function buildBrichMap(rows){
const map=new Map();
for(let i=1;i<rows.length;i++){
const r=rows[i]||[];
const o=norm(r[BR.ORDER_NO]);
if(!o)continue;
map.set(o,r[BR.SHIP_DATE]);
}
return map;
}

function processFiles(){
if(!todayWorkbook)return alert("오늘 파일 업로드 필요");

const todayRows=getRows(todayWorkbook,document.getElementById("todaySheet").value);
const brichRows=brichWorkbook?getRows(brichWorkbook,document.getElementById("brichSheet").value):[];

const todayMap=buildTodayMap(todayRows);
const brichMap=buildBrichMap(brichRows);

resultRows=[OUT_HEADERS];

for(let i=1;i<todayRows.length;i++){
const r=todayRows[i]||[];
if(!norm(r[SRC.ORDER_NO]))continue;

const key=srcKey(r);
const matched=todayMap.has(key);

let oldInbound=baseWorkbook ? (r[SRC.OLD_INBOUND]??"") : "";
let newInbound=matched ? (todayMap.get(key)??"") : "취소됨 or 출고됨";

let delayDays="",delayStatus="";
const oldDate=toDate(oldInbound),newDate=toDate(newInbound);

if(oldDate&&newDate&&newDate>oldDate){
delayDays=Math.round((newDate-oldDate)/(24*60*60*1000));
delayStatus="지연됨";
}

let due="";
if(brichWorkbook){
due=brichMap.get(norm(r[SRC.ORDER_NO]))||"";
}

let shipBlock="";
resultRows.push([
r[SRC.ORDER_DATE],
r[SRC.DELAY],
r[SRC.SELLER],
r[SRC.ORDER_NO],
r[SRC.SUPPLIER],
r[SRC.BUY_NAME],
r[SRC.PRODUCT],
r[SRC.OPTION],
oldInbound,
newInbound,
delayDays,
delayStatus,
due,
shipBlock,
""
]);
}

renderTable(resultRows);
document.getElementById("summary").innerText="총 "+(resultRows.length-1)+"건 생성";
}

function renderTable(rows){
let html="<table><thead><tr>";
rows[0].forEach(h=>html+=`<th>${h}</th>`);
html+="</tr></thead><tbody>";

for(let i=1;i<rows.length;i++){
html+="<tr>";
rows[i].forEach(v=>html+=`<td>${v??""}</td>`);
html+="</tr>";
}

html+="</tbody></table>";
document.getElementById("tableWrap").innerHTML=html;
}

function downloadResult(){
const ws=XLSX.utils.aoa_to_sheet(resultRows);
const wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"결과");
XLSX.writeFile(wb,"결과.xlsx");
}

document.getElementById("todayFile").addEventListener("change",e=>{
const f=e.target.files[0];
const r=new FileReader();
r.onload=ev=>{
todayWorkbook=XLSX.read(new Uint8Array(ev.target.result),{type:"array",cellDates:true,cellStyles:true});
fillSelect(todayWorkbook,"todaySheet");
};
r.readAsArrayBuffer(f);
});

document.getElementById("brichFile").addEventListener("change",e=>{
const f=e.target.files[0];
const r=new FileReader();
r.onload=ev=>{
brichWorkbook=XLSX.read(new Uint8Array(ev.target.result),{type:"array",cellDates:true,cellStyles:true});
fillSelect(brichWorkbook,"brichSheet");
};
r.readAsArrayBuffer(f);
});
</script>

</body>
</html>
