<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>FORESTFIT V38 STABLE FIX ENGINE</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{font-family:Arial;background:#FFF9E8;margin:0}
.wrap{max-width:1200px;margin:auto;padding:30px}
.card{background:#fff;border:1px solid #ddd;padding:12px;margin-bottom:10px}
button{width:100%;padding:10px;background:#C9A227;border:0;font-weight:bold}
h2{margin-bottom:10px}
.small{font-size:12px;color:#777}
</style>
</head>

<body>

<div class="wrap">

<h2>FORESTFIT V38 STABLE ENGINE</h2>
<div class="small">날짜 + 영업일 + 비플로우 완전 안정 버전</div>

<div class="card">
<input type="file" id="file1">
</div>

<div class="card">
<input type="file" id="file2">
</div>

<div class="card">
<label>공휴일 입력 (YYYY-MM-DD 줄바꿈)</label>
<textarea id="holiday"></textarea>
</div>

<div class="card">
<button onclick="run()">계산 실행</button>
<button onclick="downloadExcel()">다운로드</button>
</div>

<div id="status"></div>

</div>

<script>

let wb1, wb2;
let result = [];
let brichMap = new Map();

/* =========================
   기본 유틸
========================= */
function norm(v){
  return v === null || v === undefined ? "" : String(v).trim();
}

/* =========================
   날짜 변환 (핵심 수정)
========================= */
function excelDate(v){
  if(!v) return null;

  // Excel serial number
  if(typeof v === "number"){
    return new Date(Math.round((v - 25569) * 86400 * 1000));
  }

  const d = new Date(v);
  return isNaN(d) ? null : d;
}

/* YYYY-MM-DD */
function fmt(d){
  return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");
}

/* =========================
   공휴일
========================= */
function getHolidays(){
  return document.getElementById("holiday").value
    .split("\n")
    .map(v=>v.trim())
    .filter(Boolean);
}

/* =========================
   영업일 계산 (핵심)
========================= */
function addBusinessDays(date, days, holidays){

  let d = new Date(date);
  let count = 0;

  while(count < days){

    d.setDate(d.getDate() + 1);

    const day = d.getDay();
    const ymd = fmt(d);

    if(day === 0 || day === 6) continue;
    if(holidays.includes(ymd)) continue;

    count++;
  }

  return d;
}

/* =========================
   브리치 MAP (비플로우)
========================= */
function buildBrich(data){

  brichMap.clear();

  for(let i=1;i<data.length;i++){
    const r=data[i];
    if(!r) continue;

    const orderNo = norm(r[1]);
    const dateObj = excelDate(r[19]);

    if(orderNo && dateObj){
      brichMap.set(orderNo, fmt(dateObj));
    }
  }
}

/* =========================
   괄호 추출
========================= */
function getBracket(v){
  const m = String(v||"").match(/\(([^()]*)\)/);
  return m ? m[1] : "";
}

/* =========================
   J 계산 (핵심 수정)
========================= */
function calcJ(r, holidays){

  const seller = norm(r[2]);
  const orderDateObj = excelDate(r[0]);
  const orderNo = norm(r[3]);

  let j = "";

  /* 비플로우 */
  if(seller === "비플로우"){
    j = brichMap.get(orderNo) || "";
  }

  /* 퀸잇 (21 영업일) */
  else if(seller.includes("퀸잇")){
    const d = addBusinessDays(orderDateObj, 21, holidays);
    j = fmt(d);
  }

  /* 하프클럽 (15 영업일) */
  else if(seller.includes("하프클럽")){
    const d = addBusinessDays(orderDateObj, 15, holidays);
    j = fmt(d);
  }

  /* 네이버 / 롯데ON (1개월) */
  else if(seller.includes("네이버") || seller.includes("롯데ON")){
    const d = new Date(orderDateObj);
    d.setMonth(d.getMonth() + 1);
    j = fmt(d);
  }

  else{
    j = fmt(orderDateObj);
  }

  return j;
}

/* =========================
   실행
========================= */
document.getElementById("file1").onchange=async(e)=>{
  wb1 = XLSX.read(await e.target.files[0].arrayBuffer(),{type:"array"});
}

document.getElementById("file2").onchange=async(e)=>{
  wb2 = XLSX.read(await e.target.files[0].arrayBuffer(),{type:"array"});
}

function run(){

const d1 = XLSX.utils.sheet_to_json(wb1.Sheets[wb1.SheetNames[0]],{header:1,defval:""});
const d2 = XLSX.utils.sheet_to_json(wb2.Sheets[wb2.SheetNames[0]],{header:1,defval:""});

const holidays = getHolidays();

buildBrich(d2);

result = [];

/* 헤더 */
result.push([
"A 주문일자","B 지연일","C 판매처명","D 주문번호",
"E 공급처명","F 사입상품명","G 판매처상품명",
"H 옵션","I 입고예정일","J 출고준수일",
"K 출고불가여부","L 진행상황","M 처리결과"
]);

for(let i=1;i<d1.length;i++){

  const r=d1[i];
  if(!r) continue;

  const seller = norm(r[2]);
  const orderNo = norm(r[3]);

  const A = excelDate(r[0]);
  const I = excelDate(r[8]);
  const J = calcJ(r, holidays);

  const g = getBracket(r[6]);

  let status = "";

  if(seller === "비플로우"){
    status = brichMap.get(orderNo) ? "OK" : "미매칭";
  } else {
    status = "채널계산";
  }

  result.push([
    A ? fmt(A) : "",
    r[1],
    r[2],
    r[3],
    r[4],
    r[5],
    g,
    r[7],
    I ? fmt(I) : "",
    J,
    "",
    "",
    status
  ]);
}

document.getElementById("status").innerText =
"완료: " + (result.length - 1) + "건";

}

/* =========================
   다운로드
========================= */
function downloadExcel(){

const ws = XLSX.utils.aoa_to_sheet(result);
const wb = XLSX.utils.book_new();

XLSX.utils.book_append_sheet(wb,ws,"result");

XLSX.writeFile(wb,"V38_FINAL_FIXED.xlsx");

}

</script>

</body>
</html>
