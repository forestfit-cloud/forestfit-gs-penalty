<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>포레스트핏 장기지연 납기 자동 시스템 V9</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{font-family:Arial;background:#FFF9E8;margin:0;color:#4A3A12}
.wrap{max-width:1200px;margin:auto;padding:30px}

h1{color:#6B5310}

.card{
  background:#FFFDF7;
  border:1px solid #E7D8A3;
  border-radius:12px;
  padding:18px;
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

input,textarea{
  width:100%;
  padding:10px;
  margin-top:6px;
  margin-bottom:12px;
  border:1px solid #465163;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#C9A227;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

.small{font-size:12px;color:#777}

.debug{
  font-size:12px;
  background:#111;
  color:#0f0;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
  white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="wrap">

<h1>포레스트핏 장기지연 납기 자동 시스템 V9</h1>

<div class="card">
<label>1. 셀메이트 파일</label>
<input type="file" id="file1">
</div>

<div class="card">
<label>2. 브리치 파일</label>
<input type="file" id="file2">
</div>

<div class="card">
<label>공휴일 입력</label>
<textarea id="holiday"></textarea>
</div>

<div class="card">
<button onclick="run()">계산 실행</button>
<button onclick="downloadExcel()">결과 다운로드</button>
</div>

<div class="card">
<div id="status"></div>
<div id="summary"></div>
<div id="debug" class="debug"></div>
</div>

</div>

<script>

let wb1, wb2;
let result = [];

/* =========================
   공휴일
========================= */
function getHolidays(){
  return document.getElementById("holiday").value
    .split("\n")
    .map(v=>v.trim())
    .filter(Boolean);
}

function isWeekend(d){
  return d.getDay() === 0 || d.getDay() === 6;
}

function isHoliday(d, holidays){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return holidays.includes(`${y}-${m}-${dd}`);
}

/* =========================
   옵션 정리
========================= */
function cleanOption(v){
  if(!v) return "";
  return String(v)
    .replace(/\s/g,"")
    .replace(/\//g,",")
    .replace(/_/g,"")
    .replace(/기본옵션:옵션/g,"")
    .replace(/-/g,"")
    .replace(/[A-Za-z]+\d+/g,"");
}

/* =========================
   괄호 추출
========================= */
function extractBracket(v){
  const m = String(v||"").match(/\(([^()]*)\)/);
  return m ? m[1] : "";
}

/* =========================
   브리치 MAP
========================= */
function buildBrichMap(rows){

  const map = new Map();

  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r) continue;

    const key = r[1] + "|" + extractBracket(r[6]) + "|" + cleanOption(r[11]);
    map.set(key, r[19]);
  }

  return map;
}

/* =========================
   파일
========================= */
document.getElementById("file1").onchange = async (e)=>{
  wb1 = XLSX.read(await e.target.files[0].arrayBuffer(), {type:"array"});
}

document.getElementById("file2").onchange = async (e)=>{
  wb2 = XLSX.read(await e.target.files[0].arrayBuffer(), {type:"array"});
}

/* =========================
   V9 RUN
========================= */
function run(){

console.clear();

if(!wb1 || !wb2){
  alert("파일 2개 필요");
  return;
}

const holidays = getHolidays();

const data1 = XLSX.utils.sheet_to_json(wb1.Sheets[wb1.SheetNames[0]], {
  header:1,
  defval:""
});

const data2 = XLSX.utils.sheet_to_json(wb2.Sheets[wb2.SheetNames[0]], {
  header:1,
  defval:""
});

const brichMap = buildBrichMap(data2);

result = [];

let success = 0;
let fail = 0;

let debugLog = "";

for(let i=1;i<data1.length;i++){

  const r = data1[i];
  if(!r) continue;

  if(r[2] !== "비플로우") continue;

  const key = r[3] + "|" + extractBracket(r[10]) + "|" + cleanOption(r[7]);

  let shipDate = brichMap.get(key);

  if(shipDate){
    success++;
    debugLog += "MATCH OK: " + key + "\n";
  }else{
    fail++;
    shipDate = r[8];
    debugLog += "NO MATCH: " + key + "\n";
  }

  result.push([
    r[0], r[1], r[2], r[3],
    r[4], r[5], r[6], r[7],
    r[8],
    shipDate,
    r[10] || "",
    r[11] || ""
  ]);
}

/* 상태 */
document.getElementById("status").innerText =
"총 " + result.length + "건";

document.getElementById("summary").innerText =
"성공: " + success + " / 실패: " + fail;

document.getElementById("debug").innerText =
debugLog.slice(0, 2000);

}

/* =========================
   다운로드
========================= */
function downloadExcel(){

if(!result.length){
  alert("결과 없음");
  return;
}

const ws = XLSX.utils.aoa_to_sheet([
[
"주문일자","지연일","판매처명","주문번호",
"공급처명","사입상품명","판매처상품명","옵션",
"입고예정일","출고준수일","출고불가","진행상황"
],
...result
]);

const wb = XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb, ws, "result");

const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});

const blob = new Blob([wbout], {type:"application/octet-stream"});
const url = URL.createObjectURL(blob);

const a = document.createElement("a");
a.href = url;
a.download = "장기지연_결과_V9.xlsx";
document.body.appendChild(a);
a.click();
document.body.removeChild(a);

URL.revokeObjectURL(url);

}

</script>

</body>
</html>
