<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>포레스트핏 납기 시스템 V15</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{font-family:Arial;background:#FFF9E8;margin:0}
.wrap{max-width:1200px;margin:auto;padding:30px}
.card{background:#fff;border:1px solid #ddd;padding:15px;margin-bottom:10px}
button{padding:10px;width:100%;background:#C9A227;border:0}
</style>
</head>

<body>

<div class="wrap">

<h2>V15 납기 자동 시스템</h2>

<div class="card">
<input type="file" id="file1">
</div>

<div class="card">
<input type="file" id="file2">
</div>

<div class="card">
<textarea id="holiday" placeholder="공휴일"></textarea>
</div>

<div class="card">
<button onclick="run()">계산</button>
<button onclick="downloadExcel()">다운로드</button>
</div>

<div id="status"></div>

</div>

<script>

let wb1, wb2;
let result = [];

/* =========================
   날짜 변환
========================= */
function toDate(v){
  if(!v) return null;

  if(typeof v === "number"){
    return new Date((v - 25569) * 86400 * 1000);
  }

  const d = new Date(v);
  return isNaN(d) ? null : d;
}

function format(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}

/* =========================
   영업일 계산
========================= */
function addWorkDays(date, days){
  let d = new Date(date);
  let count = 0;

  while(count < days){
    d.setDate(d.getDate()+1);
    const day = d.getDay();
    if(day !== 0 && day !== 6){
      count++;
    }
  }
  return d;
}

function addMonth(date){
  const d = new Date(date);
  d.setMonth(d.getMonth()+1);
  return d;
}

/* =========================
   브리치 KEY
========================= */
function key(a,b,c){
  return a+"|"+b+"|"+c;
}

/* =========================
   RUN
========================= */
document.getElementById("file1").onchange = async (e)=>{
  wb1 = XLSX.read(await e.target.files[0].arrayBuffer(), {type:"array"});
}

document.getElementById("file2").onchange = async (e)=>{
  wb2 = XLSX.read(await e.target.files[0].arrayBuffer(), {type:"array"});
}

function run(){

const data1 = XLSX.utils.sheet_to_json(wb1.Sheets[wb1.SheetNames[0]], {header:1});
const data2 = XLSX.utils.sheet_to_json(wb2.Sheets[wb2.SheetNames[0]], {header:1});

const map = new Map();

/* =========================
   브리치 MAP
========================= */
for(let i=1;i<data2.length;i++){
  const r = data2[i];
  map.set(key(r[1],r[6],r[11]), r[19]);
}

result = [];

for(let i=1;i<data1.length;i++){

  const r = data1[i];
  if(!r) continue;

  const orderDate = toDate(r[0]);
  const seller = r[2];

  let jDate = "";

  /* =========================
     1️⃣ 비플로우
  ========================= */
  if(seller === "비플로우"){

    const k = key(r[3],r[10],r[7]);
    jDate = map.get(k);

  }else{

    /* =========================
       2️⃣ 판매처 계산
    ========================= */
    if(seller === "퀸잇"){
      jDate = addWorkDays(orderDate,21);
    }
    else if(seller === "하프클럽"){
      jDate = addWorkDays(orderDate,15);
    }
    else if(seller === "네이버 스마트스토어" || seller === "롯데ON"){
      jDate = addMonth(orderDate);
    }
  }

  result.push([
    format(orderDate),
    r[1],
    r[2],
    r[3],
    r[4],
    r[5],
    r[6],
    r[7],
    r[8],
    jDate ? format(jDate) : "",
    r[10],
    r[11]
  ]);
}

document.getElementById("status").innerText =
"완료 " + result.length + "건";

}

/* =========================
   다운로드
========================= */
function downloadExcel(){

const ws = XLSX.utils.aoa_to_sheet([
[
"주문일자","지연일","판매처","주문번호",
"공급처","사입상품","판매상품","옵션",
"입고예정일","출고준수일","출고불가","진행상황"
],
...result
]);

const wb = XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb, ws, "result");

XLSX.writeFile(wb, "V15_납기완전정리.xlsx");
}

</script>

</body>
</html>
