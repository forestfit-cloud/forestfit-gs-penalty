<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>포레스트핏 납기 시스템 V16 FIX</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{font-family:Arial;background:#FFF9E8;margin:0}
.wrap{max-width:1200px;margin:auto;padding:30px}
.card{background:#fff;border:1px solid #ddd;padding:12px;margin-bottom:10px}
button{width:100%;padding:10px;background:#C9A227;border:0;font-weight:bold}
</style>
</head>

<body>

<div class="wrap">

<h2>V16 납기 시스템 (FULL FIX)</h2>

<div class="card">
<input type="file" id="file1">
</div>

<div class="card">
<input type="file" id="file2">
</div>

<div class="card">
<textarea id="holiday" placeholder="공휴일"></textarea>
</div>

<div class="card">
<button onclick="run()">계산</button>
<button onclick="downloadExcel()">다운로드</button>
</div>

<div id="status"></div>

</div>

<script>

let wb1, wb2;
let result = [];

/* =========================
   날짜 변환 (엑셀 숫자 포함 FIX)
========================= */
function toDate(v){
  if(!v) return null;

  if(typeof v === "number"){
    return new Date(Math.round((v - 25569) * 86400 * 1000));
  }

  const d = new Date(v);
  return isNaN(d) ? null : d;
}

function format(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}

/* =========================
   공휴일
========================= */
function getHolidays(){
  return document.getElementById("holiday").value
    .split("\n")
    .map(v=>v.trim())
    .filter(Boolean);
}

function isHoliday(d, list){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return list.includes(`${y}-${m}-${dd}`);
}

function isWeekend(d){
  return d.getDay()===0 || d.getDay()===6;
}

/* =========================
   영업일 계산
========================= */
function addWorkDays(date, days, holidays){
  let d = new Date(date);
  let count = 0;

  while(count < days){
    d.setDate(d.getDate()+1);
    if(!isWeekend(d) && !isHoliday(d, holidays)){
      count++;
    }
  }
  return d;
}

/* =========================
   +1 month
========================= */
function addMonth(date){
  let d = new Date(date);
  d.setMonth(d.getMonth()+1);
  return d;
}

/* =========================
   브리치 KEY
========================= */
function cleanOption(v){
  return String(v||"")
    .replace(/\s/g,"")
    .replace(/\//g,",")
    .replace(/_/g,"")
    .replace(/-/g,"")
    .replace(/[A-Za-z]+\d+/g,"");
}

function extractBracket(v){
  const m = String(v||"").match(/\(([^()]*)\)/);
  return m ? m[1] : "";
}

function key(a,b,c){
  return a+"|"+b+"|"+c;
}

/* =========================
   RUN
========================= */
document.getElementById("file1").onchange = async (e)=>{
  wb1 = XLSX.read(await e.target.files[0].arrayBuffer(), {type:"array"});
}

document.getElementById("file2").onchange = async (e)=>{
  wb2 = XLSX.read(await e.target.files[0].arrayBuffer(), {type:"array"});
}

function run(){

const holidays = getHolidays();

const data1 = XLSX.utils.sheet_to_json(wb1.Sheets[wb1.SheetNames[0]], {header:1});
const data2 = XLSX.utils.sheet_to_json(wb2.Sheets[wb2.SheetNames[0]], {header:1});

/* =========================
   브리치 MAP
========================= */
const map = new Map();

for(let i=1;i<data2.length;i++){
  const r = data2[i];
  if(!r) continue;

  const k = key(r[1], extractBracket(r[6]), cleanOption(r[11]));
  map.set(k, r[19]);
}

result = [];

for(let i=1;i<data1.length;i++){

  const r = data1[i];
  if(!r) continue;

  const orderDate = toDate(r[0]);
  const seller = r[2];

  let j = "";

  /* =========================
     1) 비플로우
  ========================= */
  if(seller === "비플로우"){

    const k = key(r[3], extractBracket(r[6]), cleanOption(r[7]));
    j = map.get(k) || "";

  }

  /* =========================
     2) 퀸잇
  ========================= */
  else if(seller === "퀸잇"){
    j = addWorkDays(orderDate,21,holidays);
  }

  /* =========================
     3) 하프클럽
  ========================= */
  else if(seller === "하프클럽"){
    j = addWorkDays(orderDate,15,holidays);
  }

  /* =========================
     4) 네이버 / 롯데ON
  ========================= */
  else if(seller === "네이버 스마트스토어" || seller === "롯데ON"){
    j = addMonth(orderDate);
  }

  result.push([
    format(orderDate),
    r[1],
    r[2],
    r[3],
    r[4],
    r[5],
    r[6],
    r[7],
    r[8],
    j ? format(j) : "",
    r[10],
    r[11]
  ]);
}

document.getElementById("status").innerText =
"완료 : " + result.length + "건";

}

/* =========================
   DOWNLOAD
========================= */
function downloadExcel(){

const ws = XLSX.utils.aoa_to_sheet([
[
"주문일자","지연일","판매처","주문번호",
"공급처","사입상품","판매상품","옵션",
"입고예정일","출고준수일","출고불가","진행상황"
],
...result
]);

const wb = XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb, ws, "result");

XLSX.writeFile(wb, "V16_FINAL.xlsx");
}

</script>

</body>
</html>
