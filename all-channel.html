<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>포레스트핏 장기지연 납기 V62</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>
<style>
body {font-family:Arial,"Noto Sans KR",sans-serif;margin:0;padding:20px;background:#FFF9E8;color:#4A3A12;}
.wrap {max-width:1280px;margin:0 auto;}
h1{color:#6B5310;}
.card {background:#FFFDF7;border:1px solid #E7D8A3;border-radius:12px;padding:18px;margin-bottom:15px;}
input,textarea,button,select {width:100%;padding:8px;margin-top:6px;margin-bottom:12px;border:1px solid #465163;border-radius:8px;}
button {background:#C9A227;font-weight:bold;cursor:pointer;border:none;padding:10px;}
.small{font-size:12px;color:#555;}
</style>
</head>
<body>
<div class="wrap">
<h1>포레스트핏 장기지연 납기 V62</h1>

<div class="card">
<label>1. 셀메이트 파일 업로드</label>
<input type="file" id="file1" accept=".xlsx,.xls,.csv"/>
</div>

<div class="card">
<label>2. 브리치 파일 업로드</label>
<input type="file" id="file2" accept=".xlsx,.xls,.csv"/>
</div>

<div class="card">
<label>공휴일 입력 (예: 2026-07-17)</label>
<textarea id="holidays" placeholder="2026-07-17"></textarea>
</div>

<div class="card">
<button onclick="run()">계산 실행</button>
<button onclick="downloadExcel()">결과 다운로드</button>
</div>

<div class="card">
<div id="status" class="small"></div>
</div>
</div>

<script>
let wb1, wb2, result=[];
function getHolidays(){return document.getElementById("holidays").value.split("\n").map(v=>v.trim()).filter(Boolean);}
function isWeekend(d){return d.getDay()===0||d.getDay()===6;}
function isHoliday(d,holidays){const y=d.getFullYear();const m=(d.getMonth()+1).toString().padStart(2,"0");const dd=d.getDate().toString().padStart(2,"0");return holidays.includes(`${y}-${m}-${dd}`);}
function cleanOption(v){return String(v||"").replace(/\s/g,"").replace(/\//g,",").replace(/_/g,"").replace(/기본옵션:옵션/g,"").replace(/-/g,"").replace(/[A-Za-z]+\d+/g,"");}
function extractBracket(v){const m=String(v||"").match(/\(([^()]*)\)/);return m?m[1]:"";}
function addWorkdays(d,days,holidays){let dt=new Date(d);while(days>0){dt.setDate(dt.getDate()+1);if(!isWeekend(dt)&&!isHoliday(dt,holidays)) days--;}return dt;}

document.getElementById("file1").onchange = async (e)=>{wb1=XLSX.read(await e.target.files[0].arrayBuffer(),{type:"array"});}
document.getElementById("file2").onchange = async (e)=>{wb2=XLSX.read(await e.target.files[0].arrayBuffer(),{type:"array"});}

function run(){
if(!wb1||!wb2){alert("두 파일 모두 필요");return;}
const holidays=getHolidays();
const data1=XLSX.utils.sheet_to_json(wb1.Sheets[wb1.SheetNames[0]],{header:1,defval:""});
const data2=XLSX.utils.sheet_to_json(wb2.Sheets[wb2.SheetNames[0]],{header:1,defval:""});

const brichMap=new Map();
for(let i=1;i<data2.length;i++){
  const r=data2[i]; if(!r) continue;
  brichMap.set(r[1], {shipDate:r[19], channel:r[4], option:r[11], product:extractBracket(r[6])});
}

result=[];
for(let i=0;i<data1.length;i++){
  const r=data1[i]; if(!r) continue;
  let iDate=r[8]?new Date(r[8]):null;
  let jDate=null;
  const channel=r[2];
  if(channel!=="비플로우"){
    if(channel==="퀸잇") jDate=addWorkdays(new Date(r[0]),21,holidays);
    else if(channel==="하프클럽") jDate=addWorkdays(new Date(r[0]),15,holidays);
    else if(["네이버 스마트스토어","롯데ON","카카오톡스토어"].includes(channel)) {let dt=new Date(r[0]);dt.setMonth(dt.getMonth()+1); jDate=dt;}
  } else { // 비플로우
    const br=brichMap.get(r[3]);
    if(br) jDate=new Date(br.shipDate);
  }
  result.push([
    r[0], r[1], r[2], r[3], r[4], r[5], extractBracket(r[6]), r[7],
    iDate?iDate:"입고일 기입 요망", jDate?jDate:"", "", "", ""
  ]);
}
document.getElementById("status").innerText="완료: "+result.length+"건";
}

function downloadExcel(){
if(!result.length){alert("결과 없음");return;}
const ws=XLSX.utils.aoa_to_sheet([
["주문일자","지연일","판매처명","주문번호","공급처명","사입상품명","판매처상품명","옵션","입고예정일","출고준수일","출고불가","진행상황","처리결과"],
...result
]);
for(let i=1;i<=result.length;i++){
  if(ws[XLSX.utils.encode_cell({r:i,c:8})].v==="입고일 기입 요망"){
    ws[XLSX.utils.encode_cell({r:i,c:8})].s={font:{color:{rgb:"FF0000"},bold:true}};
  }
  const Icell=ws[XLSX.utils.encode_cell({r:i,c:8})];
  const Jcell=ws[XLSX.utils.encode_cell({r:i,c:9})];
  const Kcell=ws[XLSX.utils.encode_cell({r:i,c:10})];
  if(Icell && Jcell && Icell.t==="d" && Jcell.t==="d" && Icell.v>Jcell.v){
    Kcell.t="s"; Kcell.v="출고불가"; Kcell.s={font:{color:{rgb:"FF0000"},bold:true}};
  }
  else if(Icell && Jcell && Icell.t==="s" && Icell.v==="입고일 기입 요망"){Kcell.t="s"; Kcell.v="출고불가";Kcell.s={font:{color:{rgb:"FF0000"},bold:true}};}
}

const wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"result");
XLSX.writeFile(wb,"장기지연_결과_V62.xlsx");
}
</script>
</body>
</html>
