<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>기프트허브 자동 납기관리</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body {font-family: Arial; background:#f5f6f8; margin:0;}
.header {background:#111;color:#fff;padding:15px;font-size:18px;}
.container {padding:20px;}
.box {background:#fff;padding:15px;margin-bottom:15px;border-radius:8px;}
button {background:#111;color:#fff;padding:10px;border:none;cursor:pointer;}
table {width:100%;border-collapse:collapse;background:#fff;margin-top:10px;}
th,td {border:1px solid #ddd;padding:6px;font-size:12px;text-align:center;}
th {background:#f0f0f0;}
.red {color:red;font-weight:bold;}
</style>
</head>

<body>

<div class="header">📦 기프트허브 - 자동 납기관리 시스템</div>

<div class="container">

<div class="box">
<h3>1. 셀메이트 파일</h3>
<input type="file" id="cellmate">
</div>

<div class="box">
<h3>2. 브리치 파일</h3>
<input type="file" id="breach">
</div>

<div class="box">
<h3>3. 공휴일 (콤마)</h3>
<input type="text" id="holiday" placeholder="2026-06-03,2026-08-17" style="width:300px;">
</div>

<div class="box">
<button onclick="process()">계산 실행</button>
<button onclick="downloadExcel()">엑셀 다운로드</button>
</div>

<div class="box">
<table id="result">
<thead>
<tr>
<th>주문일</th><th>지연</th><th>판매처</th><th>주문번호</th>
<th>공급처</th><th>사입</th><th>상품</th><th>옵션</th>
<th>입고</th><th>출고준수</th><th>불가</th><th>상태</th><th>결과</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

</div>

<script>

let resultData = [];
let holidayList = [];

// ------------------------
// 공휴일 + 주말 체크용
// ------------------------
function isHoliday(dateStr){
    return holidayList.includes(dateStr);
}

// ------------------------
// 날짜 계산 (영업일)
// ------------------------
function addBusinessDays(dateStr, days){
    let date = new Date(dateStr);
    let count = 0;

    while(count < days){
        date.setDate(date.getDate() + 1);
        let d = date.toISOString().split('T')[0];
        let day = date.getDay();

        if(day !== 0 && day !== 6 && !isHoliday(d)){
            count++;
        }
    }
    return date.toISOString().split('T')[0];
}

// ------------------------
// 괄호 상품명 추출
// ------------------------
function extractName(text){
    let m = text.match(/\((.*?)\)/);
    return m ? m[1] : text;
}

// ------------------------
// 옵션 정리
// ------------------------
function cleanOption(v){
    return String(v)
    .replace(/\s/g,'')
    .replace(/\//g,',')
    .replace(/_/g,'')
    .replace(/기본옵션:/g,'')
    .replace(/-/g,'')
    .replace(/[A-Za-z]+\d+/g,'');
}

// ------------------------
// 파일 읽기
// ------------------------
function readExcel(file, callback){
    let reader = new FileReader();
    reader.onload = function(e){
        let data = new Uint8Array(e.target.result);
        let wb = XLSX.read(data, {type:'array'});
        let json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
        callback(json);
    };
    reader.readAsArrayBuffer(file);
}

// ------------------------
// 메인 처리
// ------------------------
function process(){

    holidayList = document.getElementById("holiday").value.split(',');

    let cellFile = document.getElementById("cellmate").files[0];

    if(!cellFile){
        alert("셀메이트 파일 필요");
        return;
    }

    readExcel(cellFile, function(data){

        resultData = [];

        data.forEach(row => {

            let orderDate = row["A"];
            let delay = row["B"];
            let channel = row["C"];
            let orderNo = row["D"];
            let supplier = row["E"];
            let productRaw = row["G"];
            let option = row["H"];
            let stock = row["I"];

            let product = extractName(productRaw);
            let opt = cleanOption(option);

            // --------------------
            // 출고준수일 계산
            // --------------------
            let due = "";

            if(channel.includes("퀸잇")){
                due = addBusinessDays(orderDate,21);
            }
            else if(channel.includes("네이버") || channel.includes("롯데ON")){
                let d = new Date(orderDate);
                d.setMonth(d.getMonth()+1);
                due = d.toISOString().split('T')[0];
            }
            else if(channel.includes("하프클럽")){
                due = addBusinessDays(orderDate,15);
            }

            // --------------------
            // 입고 체크
            // --------------------
            let stockWarn = stock ? "" : "입고예정일 기입 요망";

            // --------------------
            // 불가 판정
            // --------------------
            let blocked = (stock && due && stock > due) ? "출고불가" : "";

            resultData.push([
                orderDate, delay, channel, orderNo,
                supplier, productRaw, product, option,
                stockWarn, due, blocked, "지연", ""
            ]);

        });

        render();
    });
}

// ------------------------
// 테이블 출력
// ------------------------
function render(){

    let tbody = document.querySelector("#result tbody");
    tbody.innerHTML = "";

    resultData.forEach(r => {

        let tr = document.createElement("tr");

        tr.innerHTML = r.map((v,i)=>{
            if(i===8 && v==="입고예정일 기입 요망"){
                return `<td class="red">${v}</td>`;
            }
            if(i===10 && v==="출고불가"){
                return `<td class="red">${v}</td>`;
            }
            return `<td>${v||""}</td>`;
        }).join("");

        tbody.appendChild(tr);
    });
}

// ------------------------
// 엑셀 다운로드
// ------------------------
function downloadExcel(){

    let ws = XLSX.utils.aoa_to_sheet([
        ["주문일","지연","판매처","주문번호","공급처","사입","상품","옵션","입고","출고","불가","상태","결과"],
        ...resultData
    ]);

    let wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "result");

    XLSX.writeFile(wb, "gift_hub_result.xlsx");
}

</script>

</body>
</html>
