<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>FORESTFIT V45 AUTO SAFE ENGINE</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{font-family:Arial;background:#FFF9E8;margin:0}
.wrap{max-width:1200px;margin:auto;padding:30px}

.card{background:#fff;border:1px solid #ddd;padding:12px;margin-bottom:10px}
button{width:100%;padding:10px;background:#C9A227;border:0;font-weight:bold}

h2{margin-bottom:10px}
.small{font-size:12px;color:#777}

#status{
  margin-top:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="wrap">

<h2>FORESTFIT V45 AUTO SAFE ENGINE</h2>
<div class="small">자동 실행 + 다운로드 잠금 + 데이터 보호</div>

<div class="card">
<input type="file" id="file1">
</div>

<div class="card">
<input type="file" id="file2">
</div>

<div class="card">
<label>공휴일 입력</label>
<textarea id="holiday"></textarea>
</div>

<div class="card">
<button onclick="run()">계산 실행</button>
<button onclick="downloadExcel()" id="downloadBtn" disabled>다운로드</button>
</div>

<div id="status">파일을 업로드해주세요</div>

</div>

<script>

let wb1, wb2;
let result = [];
let brichMap = new Map();

let isLoaded1 = false;
let isLoaded2 = false;
let isDone = false;

/* =========================
   상태 UI
========================= */
function setStatus(msg){
  document.getElementById("status").innerText = msg;
}

/* =========================
   날짜
========================= */
function fmt(d){
  return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");
}

function toDate(v){
  if(!v) return null;
  if(typeof v === "number"){
    return new Date((v - 25569) * 86400 * 1000);
  }
  const d = new Date(v);
  return isNaN(d) ? null : d;
}

/* =========================
   공휴일
========================= */
function holidays(){
  return document.getElementById("holiday").value
    .split("\n")
    .map(v=>v.trim())
    .filter(Boolean);
}

/* =========================
   영업일
========================= */
function addBiz(date, days, holi){

  let d = new Date(date);
  let c = 0;

  while(c < days){

    d.setDate(d.getDate()+1);

    const day = d.getDay();
    const ymd = fmt(d);

    if(day===0 || day===6) continue;
    if(holi.includes(ymd)) continue;

    c++;
  }

  return d;
}

/* =========================
   파일 로딩
========================= */
document.getElementById("file1").onchange=async(e)=>{
  wb1 = XLSX.read(await e.target.files[0].arrayBuffer(),{type:"array"});
  isLoaded1 = true;
  checkReady();
}

document.getElementById("file2").onchange=async(e)=>{
  wb2 = XLSX.read(await e.target.files[0].arrayBuffer(),{type:"array"});
  isLoaded2 = true;
  checkReady();
}

/* =========================
   자동 상태 체크
========================= */
function checkReady(){
  if(isLoaded1 && isLoaded2){
    setStatus("파일 준비 완료 → 계산 실행 가능");
  }
}

/* =========================
   RUN
========================= */
function run(){

if(!isLoaded1 || !isLoaded2){
  setStatus("파일 2개 모두 필요");
  return;
}

setStatus("계산 중...");

const s1 = wb1.Sheets[wb1.SheetNames[0]];
const s2 = wb2.Sheets[wb2.SheetNames[0]];

const d1 = XLSX.utils.sheet_to_json(s1,{header:1,defval:""});
const d2 = XLSX.utils.sheet_to_json(s2,{header:1,defval:""});

result = [];
brichMap.clear();

/* 브리치 */
for(let i=1;i<d2.length;i++){
  const r=d2[i];
  if(!r) continue;
  brichMap.set(String(r[1]), r);
}

/* 결과 */
result.push(["A","B","C","D","E","F","G","H","I","J","K","L"]);

for(let i=1;i<d1.length;i++){
  const r=d1[i];
  if(!r) continue;

  result.push([
    r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7],r[8],r[9],r[10],r[11]
  ]);
}

isDone = true;

document.getElementById("downloadBtn").disabled = false;

setStatus("계산 완료 → 다운로드 가능");

}

/* =========================
   다운로드 (잠금)
========================= */
function downloadExcel(){

if(!isDone || result.length === 0){
  alert("먼저 계산 실행하세요");
  return;
}

const ws = XLSX.utils.aoa_to_sheet(result);
const wb = XLSX.utils.book_new();

XLSX.utils.book_append_sheet(wb,ws,"result");

XLSX.writeFile(wb,"V45_SAFE.xlsx");
}

</script>

</body>
</html>
