
<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>포레스트핏 장기지연 납기 자동 시스템 V64 FINAL6</title>


<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>


<style>

body{
    margin:0;
    padding:0;
    background:#f7f7f5;
    font-family:"Noto Sans KR",Arial,sans-serif;
    color:#333;
}


.container{
    width:900px;
    margin:40px auto;
}


.title{
    font-size:28px;
    font-weight:700;
    text-align:center;
    margin-bottom:30px;
}


.card{
    background:#fff;
    border-radius:16px;
    padding:25px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}


.label{
    font-weight:700;
    margin-bottom:8px;
    display:block;
}


input[type=file],
textarea{

    width:100%;
    box-sizing:border-box;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;

}


textarea{

    height:100px;

}


.btn{

    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    background:#222;
    color:#fff;
    font-weight:bold;
    cursor:pointer;

}


.status{

    margin-top:15px;
    font-weight:bold;

}

</style>


</head>


<body>


<div class="container">


<div class="title">

포레스트핏 장기지연 납기 자동 시스템 V64 FINAL6

</div>





<div class="card">


<label class="label">

1. 셀메이트 파일 업로드

</label>


<input type="file" id="file1" accept=".xlsx,.xls">


</div>






<div class="card">


<label class="label">

2. 브리치 파일 업로드

</label>


<input type="file" id="file2" accept=".xlsx,.xls">


</div>






<div class="card">


<label class="label">

공휴일 입력

</label>



<textarea

id="holiday"

placeholder="예시
2026-07-17
한 줄에 하나씩 입력">

</textarea>


</div>






<div class="card">


<button class="btn" onclick="calculate()">

기존 장기지연 결과 계산

</button>





<button class="btn" onclick="downloadExcel()">

기존 장기지연 결과 다운로드

</button>






<button class="btn" onclick="downloadBreachFinalExcel()">

브리치 출고준수일 연장 전 주문건 포함 최종 계산 다운로드

</button>





<div class="status" id="status"></div>


</div>


</div>






<script>


let wb1=null;

let wb2=null;


let resultData=[];





document.getElementById("file1")

.addEventListener("change",async e=>{


const file=e.target.files[0];


if(!file)

return;



wb1=XLSX.read(

await file.arrayBuffer(),

{

type:"array",

cellDates:true

}

);


});






document.getElementById("file2")

.addEventListener("change",async e=>{


const file=e.target.files[0];


if(!file)

return;



wb2=XLSX.read(

await file.arrayBuffer(),

{

type:"array",

cellDates:true

}

);


});









// 공휴일 처리
// 2026.07.17 / 2026-07-17 모두 인식


function getHoliday(){


return document

.getElementById("holiday")

.value

.split("\n")

.map(v=>v.trim())

.map(v=>v.replace(/\./g,"-"))

.filter(v=>v);



}








function dateString(d){


if(!(d instanceof Date))

return "";


return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;


}








function isWeekend(d){


return d.getDay()===0 || d.getDay()===6;


}








function isHoliday(d){


return getHoliday()

.includes(

dateString(d)

);


}








function addBusinessDays(date,days){


if(!date)

return null;



let d=new Date(date);


let count=0;



while(count<days){


d.setDate(

d.getDate()+1

);



if(

!isWeekend(d)

&&

!isHoliday(d)

){


count++;

}



}



return d;


}








function safeDate(value){


if(

value===null ||

value===undefined ||

value===""

)

return null;







if(value instanceof Date){


return isNaN(value.getTime())

?

null

:

value;


}







if(typeof value==="number"){


let x=XLSX.SSF.parse_date_code(value);



if(x){


return new Date(

x.y,

x.m-1,

x.d

);


}


}







let text=String(value).trim();







if(

text==="NaN"

||

text==="Invalid Date"

||

text==="입고일 기입 요망"

)

return null;







let match=text.match(

/^(\d{4})-(\d{2})-(\d{2})$/

);







if(match){



let d=new Date(

Number(match[1]),

Number(match[2])-1,

Number(match[3])

);



return isNaN(d.getTime())

?

null

:

d;


}







return null;


}








function extractBracket(value){


let result=

String(value||"")

.match(/\(([^()]*)\)/);



return result

?

result[1]

:

"";


}








function cleanOption(value){


if(!value)

return "";



return String(value)

.replace(/\s/g,"")

.replace(/\//g,",")

.replace(/_/g,"")

.replace(/기본옵션:옵션/g,"")

.replace(/-/g,"")

.replace(/[A-Za-z]+\d+/g,"");


}



function createBflowMap(){


let map=[];


if(!wb2)

return map;





let sheet=

wb2.Sheets[wb2.SheetNames[0]];






let rows=

XLSX.utils.sheet_to_json(

sheet,

{

header:1,

defval:"",

raw:true

}

);






for(let i=1;i<rows.length;i++){



let r=rows[i];



if(!r || !r[1])

continue;







map.push({



orderNo:String(r[1]).trim(),



channel:String(r[4] || "").trim(),



product:extractBracket(r[10]),



option:cleanOption(r[11]),



shipDate:safeDate(r[19])



});



}





return map;


}









function findBflowDate(

orderNo,

product,

option,

bflowData

){



let sameOrder=

bflowData.filter(v=>



String(v.orderNo)

===

String(orderNo)



);






if(sameOrder.length===0)

return null;







if(sameOrder.length===1)

return sameOrder[0].shipDate;







let match=

sameOrder.find(v=>



v.product===product

&&

v.option===option



);






return match

?

match.shipDate

:

null;



}











// FINAL6 수정
// 비플로우 L열 표시 기준
// 셀메이트 B열 지연일 기준
// 5일 초과 주문은 L열 표시 제외


function getProgress(

channel,

delayDay,

jDate

){



if(

!channel

||

!jDate

)

return "";







if(

Number(delayDay)>5

)

return "";








let addDay=0;






if(

channel==="지마켓"

||

channel==="옥션"

||

channel==="SSG"

){


addDay=14;


}







else if(

channel==="카카오스타일"

){


addDay=7;


}







else if(

channel==="CJ몰"

){


addDay=3;


}







else if(

channel==="롯데I몰"

||

channel==="홈앤쇼핑"

){



return `${channel} 출고예정일 연장 불가`;

}



else{


return "";

}







let extendDate=

addBusinessDays(

jDate,

addDay

);






return `${channel} 출고준수일 연장전 / 연장시 ${dateString(extendDate)}`;





}









function calculate(){


if(!wb1){


alert("셀메이트 파일을 업로드해주세요.");


return;


}






let bflowData=

createBflowMap();







let sheet=

wb1.Sheets[wb1.SheetNames[0]];







let rows=

XLSX.utils.sheet_to_json(

sheet,

{

header:1,

defval:"",

raw:true

}

);







resultData=[];







resultData.push([



"주문일자",

"지연일",

"판매처명",

"주문번호",

"공급처명",

"사입상품명",

"판매처상품명",

"옵션",

"입고예정일",

"출고준수일",

"출고불가 여부",

"진행상황",

"처리결과"



]);









for(let i=1;i<rows.length;i++){



let r=rows[i];



if(!r)

continue;







let orderDate=

safeDate(r[0]);







let inboundDate=

safeDate(r[8]);







let seller=

String(r[2] || "").trim();







let product=

extractBracket(r[6]);







let option=

cleanOption(r[7]);







let delayDay=

Number(r[1] || 0);







let jDate=null;







if(seller==="비플로우"){



jDate=

findBflowDate(

r[3],

product,

option,

bflowData

);



}







else if(

seller==="퀸잇"

){



jDate=

addBusinessDays(

orderDate,

21

);



}







else if(

seller==="하프클럽"

){



jDate=

addBusinessDays(

orderDate,

15

);



}







else if(



seller==="네이버 스마트스토어"

||

seller==="롯데ON"

||

seller==="카카오톡스토어"



){



if(orderDate){



jDate=new Date(orderDate);



jDate.setMonth(

jDate.getMonth()+1

);



}



}









let iValue=

inboundDate

?

inboundDate

:

"입고일 기입 요망";







let lValue="";







if(seller==="비플로우"){



let bMatch=

bflowData.find(v=>



String(v.orderNo)

===

String(r[3])

&&

v.product===product

&&

v.option===option



);







if(bMatch){



lValue=

getProgress(

bMatch.channel,

delayDay,

jDate

);



}



}








resultData.push([



orderDate,

delayDay,

seller,

r[3],

r[4],

r[5],

product,

r[7],

iValue,

jDate,

"",

lValue,

""



]);



}








document.getElementById("status").innerText=

"기존 계산 완료 : "

+

(resultData.length-1)

+

"건";



}











// 브리치 포함 최종 데이터

// 기존 결과 구조 유지


function createBreachFinalData(){



let finalData=

resultData.map(row=>[...row]);







if(!wb2)

return finalData;







let bflowData=

createBflowMap();








for(let i=1;i<finalData.length;i++){



let row=

finalData[i];







let orderNo=

String(row[3]).trim();







let match=

bflowData.find(v=>



String(v.orderNo)

===

orderNo



);







if(match && match.shipDate){



let extendDate=

addBusinessDays(

match.shipDate,

14

);







if(extendDate){



row[11]=

`${match.channel} 출고준수일 연장전 / 연장시 ${dateString(extendDate)}`;



}



}



}







return finalData;


}




function downloadExcel(){


if(resultData.length===0){


alert("기존 계산 먼저 실행해주세요.");


return;


}






let ws=

XLSX.utils.aoa_to_sheet(

resultData

);







applyDateFormat(ws);



applyFormulaK(ws);



applyExcelStyle(ws);



applyInputDateStyle(ws);



applyKRedStyle(ws);







let wb=

XLSX.utils.book_new();







XLSX.utils.book_append_sheet(

wb,

ws,

"장기지연결과"

);







XLSX.writeFile(

wb,

"장기지연_결과_V64_FINAL6.xlsx"

);



}











// 브리치 출고준수일 연장 전 주문건 포함 최종 계산 다운로드

function downloadBreachFinalExcel(){


if(resultData.length===0){


alert("기존 계산 먼저 실행해주세요.");


return;


}







let finalData=

createBreachFinalData();






let ws=

XLSX.utils.aoa_to_sheet(

finalData

);







applyDateFormat(ws);



applyFormulaK(ws);



applyExcelStyle(ws);



applyInputDateStyle(ws);



applyKRedStyle(ws);







let wb=

XLSX.utils.book_new();







XLSX.utils.book_append_sheet(

wb,

ws,

"브리치최종결과"

);







XLSX.writeFile(

wb,

"브리치_출고준수일_연장전_주문건포함_최종계산.xlsx"

);



}











// 날짜 셀 정상 처리

function applyDateFormat(ws){



let range=

XLSX.utils.decode_range(

ws["!ref"]

);







for(

let r=1;

r<=range.e.r;

r++

){



setDateCell(

ws,

"A"+(r+1),

ws["A"+(r+1)]?.v

);






setDateCell(

ws,

"I"+(r+1),

ws["I"+(r+1)]?.v

);






setDateCell(

ws,

"J"+(r+1),

ws["J"+(r+1)]?.v

);



}



}











// K열 수식
// L열 연장시 날짜 존재 → L 기준
// L열 없음 → 기존 J 기준


function applyFormulaK(ws){



let range=

XLSX.utils.decode_range(

ws["!ref"]

);







for(

let r=1;

r<=range.e.r;

r++

){



let row=r+1;







ws["K"+row]={



t:"str",



f:



`IF(ISNUMBER(SEARCH("연장시",L${row})),

IF(OR(ISTEXT(I${row}),I${row}>DATEVALUE(MID(L${row},FIND("연장시",L${row})+4,10))),

"출고불가",

""),

IF(OR(ISTEXT(I${row}),I${row}>J${row}),

"출고불가",

""))`



};



}



}









function applyExcelStyle(ws){



let headerStyle={



fill:{


fgColor:{


rgb:"FFD9D9D9"


}


},



font:{


bold:true,

sz:12


},



alignment:{


horizontal:"center",

vertical:"center"


}



};







for(let c=0;c<13;c++){



let cell=

XLSX.utils.encode_cell({


r:0,

c:c


});






if(ws[cell]){


ws[cell].s=

headerStyle;


}



}









Object.keys(ws).forEach(key=>{



if(key==="!ref")

return;






if(!ws[key].s){



ws[key].s={};



}







ws[key].s.alignment={



horizontal:"center",

vertical:"center"


};



});






}











// I열 입고일 기입 요망 빨간색

function applyInputDateStyle(ws){



let range=

XLSX.utils.decode_range(

ws["!ref"]

);







for(

let r=1;

r<=range.e.r;

r++

){



let cell=

ws["I"+(r+1)];







if(

cell

&&

cell.v==="입고일 기입 요망"

){



cell.s={



font:{


color:{


rgb:"FFFF0000"


},


bold:true


},



alignment:{


horizontal:"center",

vertical:"center"


}



};



}



}



}











// K열 출고불가 빨간색

function applyKRedStyle(ws){



let range=

XLSX.utils.decode_range(

ws["!ref"]

);







for(

let r=1;

r<=range.e.r;

r++

){



let cell=

ws["K"+(r+1)];






if(!cell)

continue;







cell.s={



font:{


color:{


rgb:"FFFF0000"


},


bold:true


},



alignment:{


horizontal:"center",

vertical:"center"


}



};



}



}









function setDateCell(

ws,

address,

value

){



let cell=

ws[address];






if(!cell)

return;







if(

value==="입고일 기입 요망"

){



cell.t="s";

cell.v=value;



return;



}







if(

value instanceof Date

&&

!isNaN(value.getTime())

){



cell.t="d";

cell.v=value;

cell.z="yyyy-mm-dd";



return;



}







let d=

safeDate(value);






if(d){



cell.t="d";

cell.v=d;

cell.z="yyyy-mm-dd";



return;



}







cell.t="s";

cell.v=value || "";



}




</script>


</body>

</html>
