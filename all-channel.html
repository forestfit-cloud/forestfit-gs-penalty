<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>포레스트핏 장기지연건 입고/납기 자동 비교</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{font-family:Arial,"Noto Sans KR",sans-serif;margin:0;background:#FFF9E8;color:#4A3A12}
.wrap{max-width:1280px;margin:0 auto;padding:30px}
h1{font-size:28px;margin:0 0 8px;color:#6B5310}
.desc{color:#7A6640;line-height:1.5;margin-bottom:22px}
.card{background:#FFFDF7;border:1px solid #E7D8A3;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
label{display:block;font-weight:bold;margin-bottom:8px;color:#6B5310}
input,select,textarea,button{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #465163;border-radius:10px;font-size:14px;margin-bottom:12px;background:#FFFFFF;color:#4A3A12}
textarea{min-height:96px;resize:vertical}
button{cursor:pointer;border:0;background:#C9A227;color:#6B5310;font-weight:bold}
button.secondary{background:#BFA45A;color:#FFFFFF}
.small{font-size:13px;color:#AEB8C6;line-height:1.5}
.guide{margin:14px 0 12px;padding:14px;background:#FFF6D6;border:1px solid #E2C96B;border-radius:10px;color:#6B5310}

.table-wrap{max-height:560px;overflow:auto;border:1px solid #394150;border-radius:12px;background:#fff;color:#222}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border:1px solid #d9d9d9;padding:7px;white-space:nowrap;text-align:center;vertical-align:middle}
th{background:#d9d9d9;font-weight:bold;position:sticky;top:0;z-index:1}
</style>
</head>

<body>
<div class="wrap">

<h1>포레스트핏 장기지연건 입고/납기 자동 비교</h1>

<div class="desc">
기존 파일과 오늘 파일을 비교하여 입고예정일 변경 여부를 확인하고, 브리치 파일을 함께 업로드하면 비플로우 건의 출고준수일을 보정합니다.
</div>

<div class="grid3">

<div class="card">
<label>1. 셀메이트 파일</label>
<input type="file" id="todayFile" />
<select id="todaySheet"></select>

<div class="small">
1. 셀메이트 → 주문관리<br>
2. GS 제외 전체 선택<br>
3. 파일 다운로드
</div>
</div>

<div class="card">
<label>2. 브리치 파일</label>
<input type="file" id="brichFile" />
<select id="brichSheet"></select>

<div class="small">
비플로우 상태 파일
</div>
</div>

</div>

<div class="card">
<button onclick="processFiles()">계산 실행</button>
<button class="secondary" onclick="downloadResult()">엑셀 다운로드</button>

<div class="guide">
결과는 자동 정렬되어 출력됩니다.
</div>
</div>

<div class="card">
<div id="summary"></div>
</div>

</div>

<script>
let todayWorkbook=null,brichWorkbook=null,resultRows=[];

/* 품번 추출 */
function extractBracket(v){
  const s=String(v||"");
  const m=s.match(/\(([^()]*)\)/);
  return m?("("+m[1]+")"):"";
}

function getRows(wb,sheet){
  return XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,raw:false,defval:""});
}

function fillSelect(wb,id){
  const s=document.getElementById(id);
  s.innerHTML="";
  wb.SheetNames.forEach(n=>s.add(new Option(n,n)));
  s.value=wb.SheetNames[0];
}

/* =========================
   데이터 처리
========================= */
function processFiles(){
  if(!todayWorkbook)return alert("파일 업로드 필요");

  const rows=getRows(todayWorkbook,document.getElementById("todaySheet").value);

  resultRows=[];

  for(let i=1;i<rows.length;i++){
    const r=rows[i]||[];
    if(!r.length)continue;

    resultRows.push([
      r[0], // 주문일자
      r[1], // 지연일
      r[2], // 판매처명
      r[3], // 주문번호
      r[4], // 공급처명
      r[5], // 사입상품명
      extractBracket(r[6]), // 판매처상품명
      r[7], // 옵션
      r[8], // 입고예정일
      r[12], // 출고준수일
      r[13], // 출고불가
      r[14]  // 진행상황
    ]);
  }

  document.getElementById("summary").innerText="처리 완료";
}

/* =========================
   다운로드 (스타일 포함)
========================= */
function downloadResult(){

  if(!resultRows.length) return alert("계산 실행을 먼저 눌러주세요.");

  const ws = XLSX.utils.aoa_to_sheet(resultRows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "장기지연건");

  const range = XLSX.utils.decode_range(ws['!ref']);

  /* 헤더 스타일 */
  for(let C=0;C<=range.e.c;C++){
    const addr=XLSX.utils.encode_cell({r:0,c:C});
    if(!ws[addr]) continue;

    ws[addr].s={
      font:{bold:true,sz:12},
      alignment:{horizontal:"center"},
      fill:{patternType:"solid",fgColor:{rgb:"D9D9D9"}}
    };
  }

  /* 전체 셀 연회색 + 날짜 */
  for(let R=1;R<=range.e.r;R++){
    for(let C=0;C<=range.e.c;C++){
      const addr=XLSX.utils.encode_cell({r:R,c:C});
      if(!ws[addr]) continue;

      ws[addr].s={
        fill:{patternType:"solid",fgColor:{rgb:"F2F2F2"}},
        alignment:{horizontal:"center",vertical:"middle"}
      };
    }

    /* 날짜 A, I, J */
    const a=XLSX.utils.encode_cell({r:R,c:0});
    const i=XLSX.utils.encode_cell({r:R,c:8});
    const j=XLSX.utils.encode_cell({r:R,c:9});

    if(ws[a]) ws[a].z="yyyy-mm-dd";
    if(ws[i]) ws[i].z="yyyy-mm-dd";
    if(ws[j]) ws[j].z="yyyy-mm-dd";
  }

  /* 컬럼 폭 */
  ws['!cols']=Array(range.e.c+1).fill({wch:25});

  /* 필터 */
  ws['!autofilter']={ref:XLSX.utils.encode_range(range)};

  XLSX.writeFile(wb,"장기지연건_정리.xlsx");
}

/* 파일 로딩 */
document.getElementById("todayFile").addEventListener("change",e=>{
  const f=e.target.files[0];
  const r=new FileReader();
  r.onload=evt=>{
    todayWorkbook=XLSX.read(new Uint8Array(evt.target.result),{type:"array"});
    fillSelect(todayWorkbook,"todaySheet");
  };
  r.readAsArrayBuffer(f);
});

document.getElementById("brichFile").addEventListener("change",e=>{
  const f=e.target.files[0];
  const r=new FileReader();
  r.onload=evt=>{
    brichWorkbook=XLSX.read(new Uint8Array(evt.target.result),{type:"array"});
    fillSelect(brichWorkbook,"brichSheet");
  };
  r.readAsArrayBuffer(f);
});
</script>

</body>
</html>
