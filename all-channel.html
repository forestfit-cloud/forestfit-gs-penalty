<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>포레스트핏 장기지연 납기 비교 시스템 V1</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{font-family:Arial;background:#FFF9E8;margin:0;color:#4A3A12}
.wrap{max-width:1200px;margin:auto;padding:30px}
h1{color:#6B5310}
.card{background:#FFFDF7;border:1px solid #E7D8A3;padding:18px;margin-bottom:15px;border-radius:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
input,textarea{width:100%;padding:10px;margin-top:6px}
button{width:100%;padding:12px;margin-top:10px;background:#C9A227;border:none;cursor:pointer}
.small{font-size:12px;color:#777}
</style>
</head>

<body>

<div class="wrap">

<h1>포레스트핏 장기지연 납기 비교 시스템 V1</h1>

<div class="grid">

<div class="card">
<label>1. 셀메이트 파일</label>
<input type="file" id="file1">
<div class="small">
셀메이트 → 장기지연건 다운로드
</div>
</div>

<div class="card">
<label>2. 브리치 파일</label>
<input type="file" id="file2">
<div class="small">
배송준비 / 배송지연 파일
</div>
</div>

</div>

<div class="card">
<label>공휴일</label>
<textarea id="holiday"></textarea>
</div>

<div class="card">
<button onclick="run()">계산 실행</button>
<button onclick="downloadExcel()">결과 다운로드</button>
</div>

<div class="card">
<div id="status"></div>
</div>

</div>

<script>

let wb1, wb2;
let result = [];

/* 파일 로딩 */
document.getElementById("file1").onchange = async (e)=>{
  wb1 = XLSX.read(await e.target.files[0].arrayBuffer(), {type:"array"});
}

document.getElementById("file2").onchange = async (e)=>{
  wb2 = XLSX.read(await e.target.files[0].arrayBuffer(), {type:"array"});
}

/* =========================
   핵심 계산
========================= */
function run(){

if(!wb1){
  alert("셀메이트 파일 없음");
  return;
}

/* 시트 자동 보정 */
const sheet = wb1.SheetNames?.[0];
if(!sheet){
  alert("시트 없음");
  return;
}

const data = XLSX.utils.sheet_to_json(wb1.Sheets[sheet], {
  header:1,
  defval:""
});

result = [];

for(let i=1;i<data.length;i++){
  const r = data[i];

  if(!r || r.length < 5) continue;

  result.push([
    r[0],
    r[1],
    r[2],
    r[3],
    r[4],
    r[5],
    r[6],
    r[7],
    r[8],
    r[9] || "",
    r[10] || "",
    r[11] || ""
  ]);
}

document.getElementById("status").innerText =
"완료 : " + result.length + "건";

console.log("RESULT CHECK:", result);

}

/* =========================
   다운로드
========================= */
function downloadExcel(){

if(!result || result.length === 0){
  alert("다운로드 데이터 없음 (계산 실행 먼저)");
  return;
}

const ws = XLSX.utils.aoa_to_sheet([
[
"주문일자","지연일","판매처명","주문번호",
"공급처명","사입상품명","판매처상품명","옵션",
"입고예정일","출고준수일","출고불가","진행상황"
],
...result
]);

const wb = XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb, ws, "result");

ws['!autofilter'] = {
  ref: XLSX.utils.encode_range(ws['!ref'])
};

ws['!cols'] = Array(12).fill({wch:18});

XLSX.writeFile(wb, "장기지연_결과.xlsx");

}

</script>

</body>
</html>
