<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>포레스트핏 납기 자동시스템 V31 STABLE ENGINE</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{font-family:Arial;background:#FFF9E8;margin:0}
.wrap{max-width:1200px;margin:auto;padding:30px}
.card{background:#fff;border:1px solid #ddd;padding:12px;margin-bottom:10px}
button{width:100%;padding:10px;background:#C9A227;border:0;font-weight:bold}
h2{margin-bottom:10px}
.small{font-size:12px;color:#777}
</style>
</head>

<body>

<div class="wrap">

<h2>FORESTFIT V31 STABLE ENGINE</h2>
<div class="small">비플로우 + 채널 + 날짜 + 옵션 완전 안정 구조</div>

<div class="card">
<input type="file" id="file1">
</div>

<div class="card">
<input type="file" id="file2">
</div>

<div class="card">
<textarea id="holiday" placeholder="공휴일 입력 (YYYY-MM-DD)"></textarea>
</div>

<div class="card">
<button onclick="run()">계산 실행</button>
<button onclick="downloadExcel()">다운로드</button>
</div>

<div id="status"></div>

</div>

<script>

let wb1, wb2;
let result = [];
let brichMap = new Map();

/* =========================
   기본 정규화
========================= */
function norm(v){
  return (v === null || v === undefined) ? "" : String(v).trim();
}

/* =========================
   날짜 고정
========================= */
function format(d){
  return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");
}

function toDate(v){
  if(!v) return "";

  if(typeof v === "number"){
    const d = new Date((v - 25569) * 86400 * 1000);
    return format(d);
  }

  const d = new Date(v);
  return isNaN(d) ? "" : format(d);
}

/* =========================
   파일 로드
========================= */
document.getElementById("file1").onchange = async (e)=>{
  wb1 = XLSX.read(await e.target.files[0].arrayBuffer(), {type:"array"});
}

document.getElementById("file2").onchange = async (e)=>{
  wb2 = XLSX.read(await e.target.files[0].arrayBuffer(), {type:"array"});
}

/* =========================
   브리치 MAP (주문번호 ONLY)
========================= */
function buildBrich(data){
  brichMap.clear();

  for(let i=1;i<data.length;i++){
    const r = data[i];
    if(!r) continue;

    const orderNo = norm(r[1]);   // B열
    const shipDate = toDate(r[19]); // T열

    if(orderNo){
      brichMap.set(orderNo, shipDate);
    }
  }
}

/* =========================
   핵심 J 엔진
========================= */
function calcJ(r){

  const seller = norm(r[2]);
  const orderDate = toDate(r[0]);
  const orderNo = norm(r[3]);

  let j = "";

  /* 🔥 비플로우 */
  if(seller === "비플로우"){
    j = brichMap.get(orderNo) || "";
  }

  /* 🔥 퀸잇 */
  else if(seller.includes("퀸잇")){
    const d = new Date(orderDate);
    d.setDate(d.getDate()+21);
    j = format(d);
  }

  /* 🔥 하프클럽 */
  else if(seller.includes("하프클럽")){
    const d = new Date(orderDate);
    d.setDate(d.getDate()+15);
    j = format(d);
  }

  /* 🔥 네이버 / 롯데ON */
  else if(seller.includes("네이버") || seller.includes("롯데ON")){
    const d = new Date(orderDate);
    d.setMonth(d.getMonth()+1);
    j = format(d);
  }

  /* 🔥 fallback */
  else{
    j = orderDate;
  }

  return j;
}

/* =========================
   실행
========================= */
function run(){

const data1 = XLSX.utils.sheet_to_json(wb1.Sheets[wb1.SheetNames[0]], {header:1, defval:""});
const data2 = XLSX.utils.sheet_to_json(wb2.Sheets[wb2.SheetNames[0]], {header:1, defval:""});

buildBrich(data2);

result = [];

/* =========================
   메인 루프 (절대 구조 유지)
========================= */
for(let i=1;i<data1.length;i++){

  const r = data1[i];
  if(!r) continue;

  const j = calcJ(r);

  result.push([
    norm(r[0]),
    norm(r[1]),
    norm(r[2]),
    norm(r[3]),
    norm(r[4]),
    norm(r[5]),
    norm(r[6]),
    norm(r[7]),
    norm(r[8]),
    String(j),
    norm(r[10]),
    norm(r[11])
  ]);
}

document.getElementById("status").innerText =
"완료: " + result.length + "건";

}

/* =========================
   다운로드
========================= */
function downloadExcel(){

const ws = XLSX.utils.aoa_to_sheet(result);
const wb = XLSX.utils.book_new();

XLSX.utils.book_append_sheet(wb, ws, "result");

XLSX.writeFile(wb, "V31_STABLE_ENGINE.xlsx");

}

</script>

</body>
</html>
