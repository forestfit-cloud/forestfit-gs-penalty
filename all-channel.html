<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>FORESTFIT V43 DATA SAFE ENGINE</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{font-family:Arial;background:#FFF9E8;margin:0}
.wrap{max-width:1200px;margin:auto;padding:30px}
.card{background:#fff;border:1px solid #ddd;padding:12px;margin-bottom:10px}
button{width:100%;padding:10px;background:#C9A227;border:0;font-weight:bold}
h2{margin-bottom:10px}
.small{font-size:12px;color:#777}
</style>
</head>

<body>

<div class="wrap">

<h2>FORESTFIT V43 DATA SAFE ENGINE</h2>
<div class="small">데이터 절대 유지 / 시트 자동 인식 / row 삭제 방지</div>

<div class="card">
<input type="file" id="file1">
</div>

<div class="card">
<input type="file" id="file2">
</div>

<div class="card">
<label>공휴일 (YYYY-MM-DD)</label>
<textarea id="holiday"></textarea>
</div>

<div class="card">
<button onclick="run()">계산 실행</button>
<button onclick="downloadExcel()">다운로드</button>
</div>

<div id="status"></div>

</div>

<script>

let wb1, wb2;
let result = [];
let brichMap = new Map();

/* =========================
   SAFE SHEET PICKER (핵심)
========================= */
function getFirstSheet(wb){
  const name = wb.SheetNames.find(n => wb.Sheets[n]);
  return wb.Sheets[name];
}

/* =========================
   RAW ARRAY 추출 (중요)
   → sheet_to_json 제거
========================= */
function toArray(sheet){
  return XLSX.utils.sheet_to_json(sheet, {
    header:1,
    defval:"",
    raw:false
  });
}

/* =========================
   기본 유틸
========================= */
function norm(v){
  return v === null || v === undefined ? "" : String(v).trim();
}

function fmt(d){
  return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");
}

/* =========================
   Excel 날짜 완전 고정
========================= */
function toDate(v){

  if(!v) return null;

  if(typeof v === "number"){
    return new Date(Math.round((v - 25569) * 86400 * 1000));
  }

  const d = new Date(v);
  return isNaN(d) ? null : d;
}

/* =========================
   공휴일
========================= */
function getHolidays(){
  return document.getElementById("holiday").value
    .split("\n")
    .map(v=>v.trim())
    .filter(Boolean);
}

/* =========================
   영업일 계산
========================= */
function addBusinessDays(date, days, holidays){

  let d = new Date(date);
  let count = 0;

  while(count < days){

    d.setDate(d.getDate() + 1);

    const day = d.getDay();
    const ymd = fmt(d);

    if(day === 0 || day === 6) continue;
    if(holidays.includes(ymd)) continue;

    count++;
  }

  return d;
}

/* =========================
   브리치 MAP
========================= */
function buildBrich(data){

  brichMap.clear();

  for(let i=1;i<data.length;i++){
    const r=data[i];
    if(!r || r.length === 0) continue;

    const orderNo = norm(r[1]);
    const date = toDate(r[19]);

    if(orderNo && date){
      brichMap.set(orderNo, fmt(date));
    }
  }
}

/* =========================
   J 계산
========================= */
function calcJ(r, holidays){

  const seller = norm(r[2]);
  const orderDate = toDate(r[0]);
  const orderNo = norm(r[3]);

  if(!orderDate) return "";

  let j = "";

  if(seller === "비플로우"){
    j = brichMap.get(orderNo) || "";
  }

  else if(seller.includes("퀸잇")){
    j = fmt(addBusinessDays(orderDate, 21, holidays));
  }

  else if(seller.includes("하프클럽")){
    j = fmt(addBusinessDays(orderDate, 15, holidays));
  }

  else if(seller.includes("네이버") || seller.includes("롯데ON")){
    const d = new Date(orderDate);
    d.setMonth(d.getMonth()+1);
    j = fmt(d);
  }

  else{
    j = fmt(orderDate);
  }

  return j;
}

/* =========================
   RUN
========================= */
document.getElementById("file1").onchange=async(e)=>{
  wb1 = XLSX.read(await e.target.files[0].arrayBuffer(),{type:"array"});
}

document.getElementById("file2").onchange=async(e)=>{
  wb2 = XLSX.read(await e.target.files[0].arrayBuffer(),{type:"array"});
}

function run(){

const sheet1 = getFirstSheet(wb1);
const sheet2 = getFirstSheet(wb2);

const d1 = toArray(sheet1);
const d2 = toArray(sheet2);

const holidays = getHolidays();

buildBrich(d2);

result = [];

/* 헤더 */
result.push([
"A 주문일자","B 지연일","C 판매처명","D 주문번호",
"E 공급처명","F 사입상품명","G 판매처상품명",
"H 옵션","I 입고예정일","J 출고준수일",
"K 출고불가여부","L 진행상황","M 처리결과"
]);

/* 데이터 */
for(let i=1;i<d1.length;i++){

  const r = d1[i];
  if(!r || r.length === 0) continue;

  const seller = norm(r[2]);
  const orderNo = norm(r[3]);

  const A = toDate(r[0]) ? fmt(toDate(r[0])) : "";
  const I = toDate(r[8]) ? fmt(toDate(r[8])) : "";
  const J = calcJ(r, holidays);

  const g = (r[6]||"").match(/\(([^()]*)\)/);
  const G = g ? g[1] : "";

  let status = "";

  if(seller === "비플로우"){
    status = brichMap.get(orderNo) ? "OK" : "미매칭";
  } else {
    status = "채널계산";
  }

  result.push([
    A,
    r[1],
    r[2],
    r[3],
    r[4],
    r[5],
    G,
    r[7],
    I,
    J,
    "",
    "",
    status
  ]);
}

document.getElementById("status").innerText =
"완료: " + (result.length - 1) + "건";

}

/* =========================
   DOWNLOAD
========================= */
function downloadExcel(){

const ws = XLSX.utils.aoa_to_sheet(result);
const wb = XLSX.utils.book_new();

XLSX.utils.book_append_sheet(wb,ws,"result");

XLSX.writeFile(wb,"V43_DATA_SAFE.xlsx");

}

</script>

</body>
</html>
