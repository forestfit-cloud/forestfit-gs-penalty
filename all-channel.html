<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>포레스트핏 납기 V20 AUTO HEADER</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{font-family:Arial;background:#FFF9E8;margin:0}
.wrap{max-width:1200px;margin:auto;padding:30px}
.card{background:#fff;border:1px solid #ddd;padding:12px;margin-bottom:10px}
button{width:100%;padding:10px;background:#C9A227;border:0;font-weight:bold}
h2{margin-bottom:15px}
</style>
</head>

<body>

<div class="wrap">

<h2>V20 HEADER AUTO MAPPING</h2>

<div class="card">
<input type="file" id="file1">
</div>

<div class="card">
<input type="file" id="file2">
</div>

<div class="card">
<textarea id="holiday"></textarea>
</div>

<div class="card">
<button onclick="run()">계산 실행</button>
<button onclick="downloadExcel()">다운로드</button>
</div>

<div id="status"></div>

</div>

<script>

let wb1, wb2;
let result = [];

/* =========================
   날짜 변환
========================= */
function fixDate(v){
  if(!v) return "";

  if(typeof v === "number"){
    return format(new Date((v - 25569) * 86400 * 1000));
  }

  const d = new Date(v);
  return isNaN(d) ? "" : format(d);
}

function format(d){
  return d.getFullYear()+"-"+
  String(d.getMonth()+1).padStart(2,"0")+"-"+
  String(d.getDate()).padStart(2,"0");
}

/* =========================
   공휴일
========================= */
function getHoliday(){
  return document.getElementById("holiday").value
    .split("\n")
    .map(v=>v.trim())
    .filter(Boolean);
}

function isWeekend(d){
  return d.getDay()===0 || d.getDay()===6;
}

function isHoliday(d,list){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const dd=String(d.getDate()).padStart(2,"0");
  return list.includes(`${y}-${m}-${dd}`);
}

/* =========================
   영업일
========================= */
function addWorkDays(date,days,holidays){
  let d=new Date(date);
  let cnt=0;

  while(cnt<days){
    d.setDate(d.getDate()+1);
    if(!isWeekend(d) && !isHoliday(d,holidays)){
      cnt++;
    }
  }
  return d;
}

/* =========================
   1개월
========================= */
function addMonth(date){
  const d=new Date(date);
  d.setMonth(d.getMonth()+1);
  return d;
}

/* =========================
   KEY
========================= */
function key(a,b,c){
  return a+"|"+b+"|"+c;
}

function bracket(v){
  const m=String(v||"").match(/\(([^()]*)\)/);
  return m?m[1]:"";
}

function opt(v){
  return String(v||"")
    .replace(/\s/g,"")
    .replace(/\//g,",")
    .replace(/_/g,"")
    .replace(/-/g,"")
    .replace(/[A-Za-z]+\d+/g,"");
}

/* =========================
   RUN
========================= */
document.getElementById("file1").onchange=async(e)=>{
  wb1=XLSX.read(await e.target.files[0].arrayBuffer(),{type:"array"});
}

document.getElementById("file2").onchange=async(e)=>{
  wb2=XLSX.read(await e.target.files[0].arrayBuffer(),{type:"array"});
}

function run(){

const data1=XLSX.utils.sheet_to_json(wb1.Sheets[wb1.SheetNames[0]],{header:1,defval:""});
const data2=XLSX.utils.sheet_to_json(wb2.Sheets[wb2.SheetNames[0]],{header:1,defval:""});

/* =========================
   🔥 HEADER AUTO MAP (핵심)
========================= */
const h1=data1[0];
const idx1={
  date:h1.indexOf("주문일자"),
  seller:h1.indexOf("판매처명"),
  order:h1.indexOf("주문번호"),
  product:h1.indexOf("사입상품명"),
  option:h1.indexOf("옵션")
};

const h2=data2[0];
const idx2={
  order:h2.indexOf("주문번호"),
  product:h2.indexOf("상품명"),
  option:h2.indexOf("옵션"),
  date:h2.indexOf("출고예정일")
};

/* =========================
   BRICH MAP
========================= */
const map=new Map();

for(let i=1;i<data2.length;i++){
  const r=data2[i];
  if(!r) continue;

  const k=key(
    r[idx2.order],
    bracket(r[idx2.product]),
    opt(r[idx2.option])
  );

  map.set(k,r[idx2.date]);
}

result=[];

for(let i=1;i<data1.length;i++){

  const r=data1[i];
  if(!r) continue;

  const seller=r[idx1.seller];
  const date=fixDate(r[idx1.date]);

  let j="";

  if(seller==="비플로우"){
    const k=key(
      r[idx1.order],
      bracket(r[idx1.product]),
      opt(r[idx1.option])
    );

    j=map.get(k)||"";
  }

  result.push([
    date,
    "",
    seller,
    r[idx1.order],
    "",
    r[idx1.product],
    r[idx1.product],
    r[idx1.option],
    "",
    j?fixDate(j):"",
    "",
    ""
  ]);
}

document.getElementById("status").innerText=
"완료:"+result.length+"건";

}

/* =========================
   DOWNLOAD
========================= */
function downloadExcel(){

const ws=XLSX.utils.aoa_to_sheet(result);
const wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"result");

XLSX.writeFile(wb,"V20_HEADER_AUTO.xlsx");
}

</script>

</body>
</html>
