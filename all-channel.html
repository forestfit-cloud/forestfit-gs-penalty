<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>기프트허브 - 장기지연 관리</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f5f6f8;}
.header{background:#111;color:#fff;padding:14px;font-size:18px;}
.container{padding:20px;}
.box{background:#fff;padding:15px;margin-bottom:12px;border-radius:8px;}
button{background:#111;color:#fff;padding:10px;border:none;cursor:pointer;margin-right:5px;}
table{width:100%;border-collapse:collapse;background:#fff;margin-top:10px;}
th,td{border:1px solid #ddd;padding:6px;font-size:12px;text-align:center;}
th{background:#f0f0f0;}
.red{color:red;font-weight:bold;}
</style>
</head>

<body>

<div class="header">📦 기프트허브 - 장기지연 납기관리</div>

<div class="container">

<div class="box">
<h3>1. 셀메이트 업로드</h3>
<input type="file" id="cell">
</div>

<div class="box">
<h3>2. 비플로우 업로드</h3>
<input type="file" id="bf">
</div>

<div class="box">
<h3>3. 공휴일 (콤마)</h3>
<input type="text" id="holiday" style="width:300px" placeholder="2026-06-03,2026-08-17">
</div>

<div class="box">
<button onclick="run()">계산 실행</button>
<button onclick="downloadExcel()">엑셀 다운로드</button>
</div>

<div class="box">
<table id="tb">
<thead>
<tr>
<th>주문일자</th><th>지연</th><th>판매처</th><th>주문번호</th>
<th>공급처</th><th>사입상품</th><th>상품</th><th>옵션</th>
<th>입고</th><th>출고준수</th><th>불가</th><th>상태</th><th>결과</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

</div>

<script>

/* =========================
📅 날짜 변환 (핵심)
========================= */
function excelDate(v){
    if(!v) return "";

    if(typeof v === "string" && v.includes("-")){
        return v.split("T")[0];
    }

    if(typeof v === "number"){
        let d = new Date(Math.round((v - 25569) * 86400 * 1000));
        if(!isNaN(d)){
            let y=d.getFullYear();
            let m=String(d.getMonth()+1).padStart(2,"0");
            let da=String(d.getDate()).padStart(2,"0");
            return `${y}-${m}-${da}`;
        }
    }

    let d = new Date(v);
    if(!isNaN(d)) return d.toISOString().split("T")[0];

    return "";
}

/* =========================
📦 상품명 (괄호)
========================= */
function getName(v){
    let m = String(v).match(/\((.*?)\)/);
    return m ? m[1] : v;
}

/* =========================
🧹 옵션 정리
========================= */
function cleanOpt(v){
    return String(v||"")
        .replace(/\s/g,'')
        .replace(/\//g,',')
        .replace(/_/g,'')
        .replace(/기본옵션:/g,'')
        .replace(/-/g,'')
        .replace(/[A-Za-z]+\d+/g,'');
}

/* =========================
📅 영업일
========================= */
function addBiz(date,days,holidays){
    if(!date) return "";

    let d=new Date(date);
    let c=0;

    while(c<days){
        d.setDate(d.getDate()+1);
        let t=d.toISOString().split("T")[0];
        let day=d.getDay();

        if(day!==0 && day!==6 && !holidays.includes(t)){
            c++;
        }
    }
    return d.toISOString().split("T")[0];
}

/* =========================
📌 전역
========================= */
let result=[];
let bfMap={};
let holidays=[];

/* =========================
🚀 실행
========================= */
function run(){

    holidays=document.getElementById("holiday").value.split(",");

    let cellFile=document.getElementById("cell").files[0];
    let bfFile=document.getElementById("bf").files[0];

    if(!cellFile){
        alert("셀메이트 파일 필요");
        return;
    }

    bfMap={};

    /* =========================
    비플로우 먼저 매핑
    ========================= */
    if(bfFile){

        read(bfFile,(bf)=>{

            bf.forEach((r,i)=>{
                if(i===0) return;

                let orderNo=r[1];
                let product=getName(r[10]);
                let opt=cleanOpt(r[11]);
                let ship=excelDate(r[19]);

                bfMap[orderNo+"_"+product+"_"+opt]=ship;
            });

            processCell(cellFile);
        });

    }else{
        processCell(cellFile);
    }
}

/* =========================
셀메이트 처리
========================= */
function processCell(file){

    read(file,(data)=>{

        result=[];

        data.forEach((r,i)=>{

            if(i===0) return;

            let orderDate=excelDate(r[0]);
            let delay=r[1];
            let channel=r[2];
            let orderNo=r[3];
            let supplier=r[4];
            let productRaw=r[6];
            let opt=r[7];
            let stock=excelDate(r[8]);

            let product=getName(productRaw);
            let option=cleanOpt(opt);

            let key=orderNo+"_"+product+"_"+option;

            let bfDate=bfMap[key]||"";

            /* =========================
            출고준수일
            ========================= */
            let due="";

            if(channel.includes("퀸잇")){
                due=addBiz(orderDate,21,holidays);
            }
            else if(channel.includes("네이버")||channel.includes("롯데ON")){
                let d=new Date(orderDate);
                d.setMonth(d.getMonth()+1);
                due=d.toISOString().split("T")[0];
            }
            else if(channel.includes("하프클럽")){
                due=addBiz(orderDate,15,holidays);
            }

            /* =========================
            출고불가
            ========================= */
            let blocked=(stock && due && new Date(stock)>new Date(due))
                ? "출고불가"
                : "";

            result.push([
                orderDate,
                delay,
                channel,
                orderNo,
                supplier,
                productRaw,
                product,
                opt,
                bfDate,
                due,
                blocked,
                "지연",
                ""
            ]);
        });

        render();
    });
}

/* =========================
엑셀 읽기
========================= */
function read(file,cb){
    let r=new FileReader();

    r.onload=function(e){
        let data=new Uint8Array(e.target.result);
        let wb=XLSX.read(data,{type:'array'});
        let sheet=wb.Sheets[wb.SheetNames[0]];
        let json=XLSX.utils.sheet_to_json(sheet,{header:1});
        cb(json);
    };

    r.readAsArrayBuffer(file);
}

/* =========================
렌더
========================= */
function render(){

    let tb=document.querySelector("#tb tbody");
    tb.innerHTML="";

    result.forEach(r=>{

        let tr=document.createElement("tr");

        tr.innerHTML=r.map((v,i)=>{

            if(i===8 && !v){
                return `<td class="red">입고예정일 기입 요망</td>`;
            }

            if(i===10 && v==="출고불가"){
                return `<td class="red">${v}</td>`;
            }

            return `<td>${v||""}</td>`;
        }).join("");

        tb.appendChild(tr);
    });
}

/* =========================
다운로드
========================= */
function downloadExcel(){

    let ws=XLSX.utils.aoa_to_sheet([
        ["주문일","지연","판매처","주문번호","공급처","사입상품","상품","옵션","입고","출고","불가","상태","결과"],
        ...result
    ]);

    let wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"result");

    XLSX.writeFile(wb,"gift_hub_result.xlsx");
}

</script>

</body>
</html>
