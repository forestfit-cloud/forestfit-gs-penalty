<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>포레스트핏 납기 V3 FINAL MASTER</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{font-family:Arial;background:#FFF9E8;margin:0}
.wrap{max-width:1200px;margin:auto;padding:30px}
.card{background:#fff;border:1px solid #ddd;padding:12px;margin-bottom:10px}
button{width:100%;padding:10px;background:#C9A227;border:0;font-weight:bold}
</style>
</head>

<body>

<div class="wrap">

<h2>V3 FINAL MASTER ENGINE</h2>

<div class="card">
<input type="file" id="file1">
</div>

<div class="card">
<input type="file" id="file2">
</div>

<div class="card">
<textarea id="holiday"></textarea>
</div>

<div class="card">
<button onclick="run()">계산 실행</button>
<button onclick="downloadExcel()">다운로드</button>
</div>

<div id="status"></div>

</div>

<script>

let wb1, wb2;
let result = [];

/* =========================
   날짜 변환
========================= */
function toDate(v){
  if(!v) return "";

  if(typeof v === "number"){
    return new Date((v - 25569) * 86400 * 1000);
  }

  const d = new Date(v);
  return isNaN(d) ? "" : d;
}

function fmt(d){
  return d.getFullYear()+"-"+
  String(d.getMonth()+1).padStart(2,"0")+"-"+
  String(d.getDate()).padStart(2,"0");
}

/* =========================
   옵션 정리
========================= */
function opt(v){
  return String(v||"")
    .replace(/\s/g,"")
    .replace(/\//g,",")
    .replace(/_/g,"")
    .replace(/-/g,"")
    .replace(/[A-Za-z]+\d+/g,"");
}

function bracket(v){
  const m = String(v||"").match(/\(([^()]*)\)/);
  return m ? m[1].replace(/\s/g,"") : "";
}

/* =========================
   KEY
========================= */
function key(a,b,c){
  return a+"|"+b+"|"+c;
}

/* =========================
   RUN
========================= */
document.getElementById("file1").onchange=async(e)=>{
  wb1=XLSX.read(await e.target.files[0].arrayBuffer(),{type:"array"});
}

document.getElementById("file2").onchange=async(e)=>{
  wb2=XLSX.read(await e.target.files[0].arrayBuffer(),{type:"array"});
}

function run(){

const d1 = XLSX.utils.sheet_to_json(wb1.Sheets[wb1.SheetNames[0]], {header:1, defval:""});
const d2 = XLSX.utils.sheet_to_json(wb2.Sheets[wb2.SheetNames[0]], {header:1, defval:""});

/* =========================
   브리치 MAP
========================= */
const map = new Map();

for(let i=1;i<d2.length;i++){
  const r = d2[i];
  if(!r) continue;

  const k = key(
    r[1],
    bracket(r[10]),
    opt(r[11])
  );

  map.set(k, r[19]);
}

result = [];

/* =========================
   메인 (1번 파일 전체 유지)
========================= */
for(let i=1;i<d1.length;i++){

  const r = d1[i];
  if(!r) continue;

  const seller = r[2];
  const orderDate = toDate(r[0]);

  let j = "";

  /* =========================
     1) 비플로우 → 브리치
  ========================= */
  if(seller === "비플로우"){

    const k = key(
      r[3],
      bracket(r[6]),
      opt(r[7])
    );

    j = map.get(k) || "";
  }

  /* =========================
     2) 나머지 채널 계산
  ========================= */
  else if(seller.includes("퀸잇")){
    j = new Date(orderDate.setDate(orderDate.getDate()+21));
  }

  else if(seller.includes("하프클럽")){
    j = new Date(orderDate.setDate(orderDate.getDate()+15));
  }

  else if(
    seller.includes("네이버") ||
    seller.includes("롯데ON")
  ){
    j = new Date(orderDate.setMonth(orderDate.getMonth()+1));
  }

  result.push([
    r[0], r[1], r[2], r[3],
    r[4], r[5], r[6], r[7],
    r[8],
    j ? fmt(j) : "",
    r[10], r[11]
  ]);
}

document.getElementById("status").innerText =
"완료: " + result.length + "건";

}

/* =========================
   DOWNLOAD
========================= */
function downloadExcel(){

const ws = XLSX.utils.aoa_to_sheet([
[
"주문일자","지연일","판매처","주문번호",
"공급처","사입상품","판매상품","옵션",
"입고예정일","출고준수일","출고불가","진행상황"
],
...result
]);

const wb = XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb, ws, "result");

XLSX.writeFile(wb, "V3_FINAL.xlsx");
}

</script>

</body>
</html>
