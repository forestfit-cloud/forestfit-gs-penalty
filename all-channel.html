<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>포레스트핏 납기 V2 FINAL STABLE</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{font-family:Arial;background:#FFF9E8;margin:0}
.wrap{max-width:1200px;margin:auto;padding:30px}
.card{background:#fff;border:1px solid #ddd;padding:12px;margin-bottom:10px}
button{width:100%;padding:10px;background:#C9A227;border:0;font-weight:bold}
h2{margin-bottom:15px}
</style>
</head>

<body>

<div class="wrap">

<h2>V2 FINAL STABLE ENGINE</h2>

<div class="card">
<input type="file" id="file1">
</div>

<div class="card">
<input type="file" id="file2">
</div>

<div class="card">
<textarea id="holiday"></textarea>
</div>

<div class="card">
<button onclick="run()">계산 실행</button>
<button onclick="downloadExcel()">다운로드</button>
</div>

<div id="status"></div>

</div>

<script>

let wb1, wb2;
let result = [];

/* =========================
   날짜 완전 고정 변환
========================= */
function format(d){
  return d.getFullYear()+"-"+
  String(d.getMonth()+1).padStart(2,"0")+"-"+
  String(d.getDate()).padStart(2,"0");
}

function toDate(v){
  if(!v) return "";

  // Excel serial
  if(typeof v === "number"){
    return format(new Date(Math.round((v - 25569) * 86400 * 1000)));
  }

  const d = new Date(v);
  return isNaN(d) ? "" : format(d);
}

/* =========================
   옵션 정리 (핵심 안정화)
========================= */
function opt(v){
  return String(v||"")
    .replace(/\s/g,"")
    .replace(/\//g,",")
    .replace(/_/g,"")
    .replace(/-/g,"")
    .replace(/기본옵션:옵션/g,"")
    .replace(/[A-Za-z]+\d+/g,"")
    .trim();
}

/* =========================
   상품 괄호
========================= */
function bracket(v){
  const m = String(v||"").match(/\(([^()]*)\)/);
  return m ? m[1].replace(/\s/g,"") : "";
}

/* =========================
   KEY (완전 고정)
========================= */
function key(a,b,c){
  return String(a).trim()+"|"+
         String(b).trim()+"|"+
         String(c).trim();
}

/* =========================
   RUN
========================= */
document.getElementById("file1").onchange=async(e)=>{
  wb1=XLSX.read(await e.target.files[0].arrayBuffer(),{type:"array"});
}

document.getElementById("file2").onchange=async(e)=>{
  wb2=XLSX.read(await e.target.files[0].arrayBuffer(),{type:"array"});
}

function run(){

const d1 = XLSX.utils.sheet_to_json(wb1.Sheets[wb1.SheetNames[0]], {
  header:1,
  defval:""
});

const d2 = XLSX.utils.sheet_to_json(wb2.Sheets[wb2.SheetNames[0]], {
  header:1,
  defval:""
});

/* =========================
   BRICH MAP (절대 안정)
========================= */
const map = new Map();

for(let i=1;i<d2.length;i++){
  const r = d2[i];
  if(!r) continue;

  const k = key(
    r[1],                 // 주문번호
    bracket(r[10]),      // 상품
    opt(r[11])           // 옵션
  );

  map.set(k, r[19]); // 출고예정일
}

result = [];

/* =========================
   MAIN LOOP (절대 유지)
========================= */
for(let i=1;i<d1.length;i++){

  const r = d1[i];
  if(!r) continue;

  const seller = r[2];
  const orderDate = toDate(r[0]);

  let j = "";

  /* =========================
     비플로우만 브리치 매칭
  ========================= */
  if(seller === "비플로우"){

    const k = key(
      r[3],             // 주문번호
      bracket(r[6]),    // 상품
      opt(r[7])        // 옵션
    );

    j = map.get(k) || "";
  }

  result.push([
    toDate(r[0]),
    r[1] || "",
    seller || "",
    r[3] || "",
    r[4] || "",
    r[5] || "",
    r[6] || "",
    r[7] || "",
    toDate(r[8]) || "",
    j || "",
    r[10] || "",
    r[11] || ""
  ]);
}

document.getElementById("status").innerText =
"완료: " + result.length + "건";

}

/* =========================
   DOWNLOAD (단순 export - 절대 스타일 건드리지 않음)
========================= */
function downloadExcel(){

const ws = XLSX.utils.aoa_to_sheet(result);
const wb = XLSX.utils.book_new();

XLSX.utils.book_append_sheet(wb, ws, "result");

XLSX.writeFile(wb, "V2_FINAL.xlsx");
}

</script>

</body>
</html>
