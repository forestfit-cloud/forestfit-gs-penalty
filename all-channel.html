<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>포레스트핏 장기지연 납기 자동 시스템 V64 FINAL4</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{
    margin:0;
    padding:0;
    background:#f7f7f5;
    font-family:"Noto Sans KR",Arial,sans-serif;
    color:#333;
}

.container{
    width:900px;
    margin:40px auto;
}

.title{
    font-size:28px;
    font-weight:700;
    text-align:center;
    margin-bottom:30px;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:25px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.label{
    font-weight:700;
    margin-bottom:8px;
    display:block;
}

input[type=file],
textarea{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
}

textarea{
    height:100px;
}

.btn{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    background:#222;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    opacity:.85;
}

.status{
    margin-top:15px;
    font-weight:bold;
}
</style>

</head>


<body>


<div class="container">


<div class="title">
포레스트핏 장기지연 납기 자동 시스템 V64 FINAL4
</div>



<div class="card">

<label class="label">
1. 셀메이트 파일 업로드
</label>

<input type="file" id="file1" accept=".xlsx,.xls">

</div>




<div class="card">

<label class="label">
2. 브리치 파일 업로드
</label>

<input type="file" id="file2" accept=".xlsx,.xls">

</div>




<div class="card">

<label class="label">
공휴일 입력
</label>

<textarea 
id="holiday"
placeholder="예시
2026-07-17
한 줄에 하나씩 입력"></textarea>

</div>




<div class="card">

<button class="btn" onclick="calculate()">
기존 장기지연 결과 계산
</button>


<button class="btn" onclick="downloadExcel()">
기존 장기지연 결과 다운로드
</button>


<button class="btn" onclick="calculateBreach()">
브리치 출고준수일 연장 전 주문건 포함 최종 계산
</button>


<button class="btn" onclick="downloadBreachExcel()">
브리치 출고준수일 연장 전 주문건 포함 최종 계산 다운로드
</button>



<div class="status" id="status"></div>


</div>


</div>




<script>


let wb1=null;
let wb2=null;

let resultData=[];

let breachResultData=[];





document.getElementById("file1")
.addEventListener("change",async e=>{


const file=e.target.files[0];

if(!file)
return;



wb1=XLSX.read(

await file.arrayBuffer(),

{
type:"array",
cellDates:true
}

);


});






document.getElementById("file2")
.addEventListener("change",async e=>{


const file=e.target.files[0];

if(!file)
return;



wb2=XLSX.read(

await file.arrayBuffer(),

{
type:"array",
cellDates:true
}

);


});








function getHoliday(){


return document
.getElementById("holiday")
.value
.split("\n")
.map(v=>v.trim())
.filter(v=>v);



}








function dateString(d){


if(!(d instanceof Date))
return "";



return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;


}








function isWeekend(d){


return d.getDay()===0 || d.getDay()===6;


}







function isHoliday(d){


return getHoliday()
.includes(
dateString(d)
);


}







function addBusinessDays(date,days){


if(!date)
return null;



let d=new Date(date);


let count=0;



while(count<days){


d.setDate(
d.getDate()+1
);



if(
!isWeekend(d)
&&
!isHoliday(d)
){


count++;

}


}



return d;


}






function safeDate(value){


if(
value===null ||
value===undefined ||
value===""
){

return null;

}




if(value instanceof Date){


return isNaN(value.getTime())
?
null
:
value;


}






if(typeof value==="number"){


let x=XLSX.SSF.parse_date_code(value);



if(x){


return new Date(
x.y,
x.m-1,
x.d
);


}


}







let text=String(value).trim();





if(
text==="NaN" ||
text==="Invalid Date" ||
text==="입고일 기입 요망"
){


return null;


}






let match=text.match(
/^(\d{4})-(\d{2})-(\d{2})$/
);



if(match){


let d=new Date(

Number(match[1]),

Number(match[2])-1,

Number(match[3])

);



return isNaN(d.getTime())
?
null
:
d;


}






return null;


}








function extractBracket(value){


let result=

String(value||"")
.match(/\(([^()]*)\)/);



return result
?
result[1]
:
"";


}






function cleanOption(value){


if(!value)
return "";



return String(value)

.replace(/\s/g,"")

.replace(/\//g,",")

.replace(/_/g,"")

.replace(/기본옵션:옵션/g,"")

.replace(/-/g,"")

.replace(/[A-Za-z]+\d+/g,"");


}



function createBflowMap(){


let map=[];


if(!wb2)
return map;



let sheet =
wb2.Sheets[wb2.SheetNames[0]];



let rows =
XLSX.utils.sheet_to_json(

sheet,

{

header:1,

defval:"",

raw:true

}

);






for(let i=1;i<rows.length;i++){


let r=rows[i];


if(!r || !r[1])
continue;





map.push({


orderNo:String(r[1]).trim(),


channel:r[4] || "",


product:extractBracket(r[10]),


option:cleanOption(r[11]),


shipDate:safeDate(r[19])


});



}





return map;


}









function findBflowDate(

orderNo,

product,

option,

bflowData

){



let sameOrder =

bflowData.filter(v=>


String(v.orderNo)

===

String(orderNo)


);





if(sameOrder.length===0)

return null;







if(sameOrder.length===1)

return sameOrder[0].shipDate;







let match =

sameOrder.find(v=>


v.product===product

&&

v.option===option


);






return match

?

match.shipDate

:

null;



}









// L열 진행상황
// 기존 FINAL3 유지
// B열 지연일 기준 1~5일


function getProgress(

channel,

delayDay,

jDate

){



if(

!channel

||

!jDate

){

return "";

}



if(

delayDay < 1

||

delayDay > 5

){

return "";

}





let addDay=0;






if(

channel==="지마켓"

||

channel==="옥션"

||

channel==="SSG"

){


addDay=14;


}





else if(

channel==="카카오스타일"

){


addDay=7;


}





else if(

channel==="CJ몰"

){


addDay=3;


}





else if(

channel==="롯데I몰"

||

channel==="홈앤쇼핑"

){



return `${channel} 출고예정일 연장 불가`;

}





else{


return "";

}





let extendDate =

addBusinessDays(

jDate,

addDay

);






return `${channel} 출고준수일 연장전 / 연장시 ${dateString(extendDate)}`;



}









function calculate(){


if(!wb1){

alert("1번 파일을 업로드해주세요.");

return;

}





let bflowData =
createBflowMap();





let sheet =
wb1.Sheets[wb1.SheetNames[0]];




let rows =
XLSX.utils.sheet_to_json(

sheet,

{

header:1,

defval:"",

raw:true

}

);






resultData=[];



resultData.push([


"주문일자",

"지연일",

"판매처명",

"주문번호",

"공급처명",

"사입상품명",

"판매처상품명",

"옵션",

"입고예정일",

"출고준수일",

"출고불가 여부",

"진행상황",

"처리결과"



]);







for(let i=1;i<rows.length;i++){


let r=rows[i];


if(!r)

continue;






let orderDate =
safeDate(r[0]);



let inboundDate =
safeDate(r[8]);



let seller =
r[2] || "";



let product =
extractBracket(r[6]);



let option =
cleanOption(r[7]);



let jDate=null;






if(seller==="비플로우"){



jDate =

findBflowDate(

r[3],

product,

option,

bflowData

);



}







else if(

seller==="퀸잇"

){



jDate =

addBusinessDays(

orderDate,

21

);



}







else if(

seller==="하프클럽"

){



jDate =

addBusinessDays(

orderDate,

15

);



}







else if(

seller==="네이버 스마트스토어"

||

seller==="롯데ON"

||

seller==="카카오톡스토어"

){



if(orderDate){



jDate=new Date(orderDate);



jDate.setMonth(

jDate.getMonth()+1

);



}



}








let iValue =

inboundDate

?

inboundDate

:

"입고일 기입 요망";







let lValue="";







if(seller==="비플로우"){



let bMatch =

bflowData.find(v=>



String(v.orderNo)

===

String(r[3])


&&


v.product===product


&&


v.option===option



);







if(bMatch){



lValue =

getProgress(

bMatch.channel,

Number(r[1]),

jDate

);



}



}









resultData.push([



orderDate,

r[1],

seller,

r[3],

r[4],

r[5],

product,

r[7],

iValue,

jDate,

"",

lValue,

""



]);



}





document.getElementById("status").innerText =


"기존 계산 완료 : "

+

(resultData.length-1)

+

"건";



}









// 브리치 연장 계산용 데이터 생성


function calculateBreach(){


if(!wb2){

alert("브리치 파일을 업로드해주세요.");

return;

}



let bflowData =
createBflowMap();



breachResultData=[];



breachResultData.push([


"주문번호",

"판매채널",

"상품명",

"옵션",

"출고준수일",

"연장 후 출고준수일",

"결과"


]);






bflowData.forEach(v=>{



if(!v.shipDate)
return;




let extendDate =
addBusinessDays(
v.shipDate,
14
);



breachResultData.push([



v.orderNo,

v.channel,

v.product,

v.option,

v.shipDate,

extendDate,

"연장 계산 완료"



]);



});





document.getElementById("status").innerText =


"브리치 계산 완료 : "

+

(breachResultData.length-1)

+

"건";



}




function downloadExcel(){


if(resultData.length===0){


alert("기존 계산 먼저 실행해주세요.");


return;


}





let ws =

XLSX.utils.aoa_to_sheet(

resultData

);







// 날짜 처리

for(let i=1;i<resultData.length;i++){


let row=i+1;



setDateCell(

ws,

"A"+row,

resultData[i][0]

);



setDateCell(

ws,

"I"+row,

resultData[i][8]

);



setDateCell(

ws,

"J"+row,

resultData[i][9]

);



}







// K열 최종 수식
// L열 연장 날짜 존재 시 L 기준
// L열 없으면 기존 J 기준 유지



for(

let i=2;

i<=resultData.length;

i++

){



ws["K"+i]={


t:"str",



f:

`IF(ISNUMBER(SEARCH("연장시",L${i})),
IF(I${i}>DATEVALUE(MID(L${i},FIND("연장시",L${i})+4,10)),"출고불가",""),
IF(OR(ISTEXT(I${i}),I${i}>J${i}),"출고불가",""))`


};



}







let headerStyle={



fill:{


fgColor:{

rgb:"FFD9D9D9"

}


},



font:{


bold:true,

sz:12


},



alignment:{


horizontal:"center",

vertical:"center"


}



};








for(let c=0;c<13;c++){



let cell =

XLSX.utils.encode_cell({


r:0,

c:c


});



if(ws[cell]){


ws[cell].s=headerStyle;


}



}









// 전체 가운데 정렬


Object.keys(ws).forEach(key=>{


if(key==="!ref")

return;



if(!ws[key].s){

ws[key].s={};


}



ws[key].s.alignment={



horizontal:"center",

vertical:"center"



};



});









// I열 입고일 기입 요망 빨간색



for(

let i=2;

i<=resultData.length;

i++

){



let cell=

ws["I"+i];



if(

cell

&&

cell.v==="입고일 기입 요망"

){



cell.s={



font:{


color:{


rgb:"FFFF0000"


},


bold:true


},



alignment:{


horizontal:"center",

vertical:"center"


}



};



}



}









// K열 출고불가 빨간색 굵게



for(

let i=2;

i<=resultData.length;

i++

){



let cell=

ws["K"+i];



cell.s={



font:{


color:{


rgb:"FFFF0000"


},


bold:true


},



alignment:{


horizontal:"center",

vertical:"center"


}



};



}









let wb=

XLSX.utils.book_new();





XLSX.utils.book_append_sheet(

wb,

ws,

"장기지연결과"

);





XLSX.writeFile(

wb,

"장기지연_결과_V64_FINAL4.xlsx"

);



}









function setDateCell(

ws,

address,

value

){



let cell=

ws[address];



if(!cell)

return;





// 입고일 기입 요망 문자 보호



if(

value==="입고일 기입 요망"

){



cell.t="s";

cell.v=value;



return;



}







if(

value instanceof Date

&&

!isNaN(value.getTime())

){



cell.t="d";

cell.v=value;

cell.z="yyyy-mm-dd";



return;



}







let d=

safeDate(value);



if(d){



cell.t="d";

cell.v=d;

cell.z="yyyy-mm-dd";



return;



}







cell.t="s";

cell.v=value || "";



}




function downloadBreachExcel(){


if(breachResultData.length===0){


alert("브리치 계산 먼저 실행해주세요.");


return;


}







let ws =

XLSX.utils.aoa_to_sheet(

breachResultData

);







// 날짜 처리

for(let i=1;i<breachResultData.length;i++){



let row=i+1;




setDateCell(

ws,

"E"+row,

breachResultData[i][4]

);





setDateCell(

ws,

"F"+row,

breachResultData[i][5]

);





}









let headerStyle={



fill:{


fgColor:{

rgb:"FFD9D9D9"

}


},



font:{


bold:true,

sz:12


},



alignment:{


horizontal:"center",

vertical:"center"


}



};









for(let c=0;c<7;c++){



let cell =

XLSX.utils.encode_cell({


r:0,

c:c


});



if(ws[cell]){


ws[cell].s=headerStyle;


}



}









Object.keys(ws).forEach(key=>{


if(key==="!ref")

return;



if(!ws[key].s){

ws[key].s={};


}



ws[key].s.alignment={


horizontal:"center",

vertical:"center"


};



});










let wb=

XLSX.utils.book_new();





XLSX.utils.book_append_sheet(

wb,

ws,

"브리치연장계산"

);






XLSX.writeFile(

wb,

"브리치_출고준수일_연장전_주문건포함_최종계산.xlsx"

);



}








</script>


</body>

</html>
