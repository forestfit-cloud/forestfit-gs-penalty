<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>재고장 생성 툴</title>


<style>

*{
box-sizing:border-box;
}


body{

font-family:Pretendard,
"Malgun Gothic",
sans-serif;

background:#f7f3eb;

padding:40px;

color:#173d2b;

}



h1{

font-size:32px;

margin:0 0 10px;

}



.subtitle{

color:#777;

margin-bottom:30px;

}




.header-area{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:25px;

}




button{

border:none;

border-radius:12px;

padding:12px 20px;

cursor:pointer;

font-weight:bold;

}



.add-btn{

background:#173d2b;

color:white;

}



.download-btn{

background:#4d8b5b;

color:white;

}



.analyze-btn{

background:#d8a84e;

color:white;

}



.delete-btn{

background:#eee;

color:#777;

}




.card{

background:white;

border-radius:20px;

padding:25px;

margin-bottom:20px;

box-shadow:
0 10px 25px rgba(0,0,0,.08);

}




.card-header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

}





.grid{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:20px;

}





.input-box{

display:flex;

flex-direction:column;

gap:8px;

}





label{

font-size:14px;

font-weight:bold;

}




input,
select,
textarea{

border:1px solid #ddd;

border-radius:10px;

padding:12px;

font-size:14px;

}



textarea{

height:200px;

resize:none;

}




.notice{

background:#faf8f3;

padding:15px;

border-radius:12px;

color:#666;

margin-top:20px;

}




.result-box{

background:white;

border-radius:20px;

padding:25px;

margin-top:20px;

min-height:150px;

}




table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}



th,
td{

border:1px solid #ddd;

padding:10px;

text-align:center;

}



.popup{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.4);

align-items:center;

justify-content:center;

}



.popup-inner{

background:white;

padding:30px;

border-radius:20px;

width:500px;

}



</style>


</head>


<body>


<h1>
📦 재고장 생성 툴
</h1>


<div class="subtitle">

거래처 재고표 입력 → 자동 분석 → 재고장 생성

</div>





<div class="header-area">


<button class="add-btn"
onclick="addProduct()">

➕ 상품 추가

</button>



<button class="download-btn"
onclick="downloadExcel()">

📥 엑셀 다운로드

</button>


</div>





<div id="productArea">

</div>





<div style="text-align:center;margin-top:20px;">


<button class="analyze-btn"
onclick="analyzeAll()">

🔍 전체 분석

</button>


</div>





<h2>
📋 재고장 미리보기
</h2>


<div id="resultBox"
class="result-box">

분석 후 결과가 표시됩니다.

</div>





<!-- 확인 팝업 -->

<div id="popup"
class="popup">


<div class="popup-inner">


<h3 id="popupTitle">

</h3>


<div id="popupContent">

</div>


<br>


<button onclick="closePopup()">

확인

</button>


</div>


</div>





<script>


let productCount=0;


let products=[];


let resultData=[];



function addProduct(){


productCount++;


let area=
document.getElementById("productArea");



let card=
document.createElement("div");


card.className="card";


card.dataset.id=productCount;



card.innerHTML=`


<div class="card-header">


<h2>
상품 ${productCount}
</h2>


<button class="delete-btn"
onclick="deleteProduct(this)">

삭제

</button>


</div>





<div class="grid">


<div class="input-box">


<label>
셀메이트 상품명
</label>


<input class="product-name"
placeholder="예) 여름노컷진14탄">


</div>




<div class="input-box">


<label>
거래처
</label>


<select class="company">


<option value="">
선택
</option>


<option value="lizard">
리자드
</option>


<option value="kdg">
케이디지
</option>


<option value="norunja">
노른자
</option>


<option value="sinabro">
시나브로
</option>


<option value="remind">
리마인드
</option>


<option value="newhang">
뉴행
</option>


<option value="shinan">
신안어패럴
</option>


<option value="direct">
직접입력
</option>


</select>


</div>


</div>





<div class="input-box"
style="margin-top:20px;">


<label>
사입 상품명
</label>


<textarea
class="stock-code"
placeholder="재고표 그대로 붙여넣기"></textarea>


</div>




<div class="notice">

색상 / 기장 / 사이즈 패턴을 자동 분석합니다.

</div>



`;



area.appendChild(card);


}





function deleteProduct(btn){


btn.closest(".card").remove();


}



function closePopup(){

document.getElementById("popup").style.display="none";

}
// ================================
// 상품 분석
// ================================


function analyzeAll(){


resultData=[];



let cards =
document.querySelectorAll(".card");



cards.forEach(card=>{


let productName =
card.querySelector(".product-name").value;



let company =
card.querySelector(".company").value;



let codes =
card.querySelector(".stock-code")
.value
.split("\n")
.map(v=>v.trim())
.filter(v=>v);



codes.forEach(code=>{


let data =
parseCode(company,code);



data.productName =
productName;


resultData.push(data);



});



});



showResult();


}







// ================================
// 거래처 분석
// ================================


function parseCode(company,code){



switch(company){


case "lizard":

return analyzeLizard(code);



case "kdg":

return analyzeKdg(code);



case "norunja":

return analyzeNorunja(code);



case "sinabro":

return analyzeSinabro(code);



case "remind":

return analyzeRemind(code);



case "newhang":

return analyzeNewhang(code);



case "shinan":

return analyzeShinan(code);



default:


return {

code:code,

color:"확인필요",

length:"확인필요",

size:"확인필요"

};


}



}








// ================================
// 리자드
// ================================


function analyzeLizard(code){


let length="기본";


if(code.includes("SH"))
length="숏";


if(code.includes("LONG"))
length="롱";



let temp =
code
.replace("LONG","")
.replace("SH","");



let arr =
temp.split("-");



return {


code:code,


color:
arr[arr.length-1],


length:length,


size:""


};



}







// ================================
// 케이디지
// ================================


function analyzeKdg(code){


let length="기본";


if(code.includes("SH"))
length="숏";


if(code.includes("LO"))
length="롱";



let temp =
code
.replace("SH","")
.replace("LO","");



return {


code:code,


color:
temp.split("-").pop(),


length:length,


size:""


};


}







// ================================
// 노른자
// ================================


function analyzeNorunja(code){


let length="기본";


if(code.endsWith("SH"))
length="숏";


if(code.endsWith("LO"))
length="롱";



let temp =
code
.replace("SH","")
.replace("LO","");



return {


code:code,


color:
temp.split("-").pop(),


length:length,


size:""


};


}







// ================================
// 시나브로
// ================================


function analyzeSinabro(code){


return {


code:code,


color:"확인필요",


length:
code.endsWith("-1")
?
"확인필요"
:
"기본",


size:""


};


}







// ================================
// 리마인드
// ================================


function analyzeRemind(code){


let length="기본";


if(code.includes("(숏)"))
length="숏";


if(code.includes("(롱)"))
length="롱";



return {


code:code,


color:"확인필요",


length:length,


size:""


};


}







// ================================
// 뉴행
// ================================


function analyzeNewhang(code){


let length="기본";


if(code.includes("-SH"))
length="숏";


if(code.includes("-LO"))
length="롱";



return {


code:code,


color:"확인필요",


length:length,


size:""


};


}







// ================================
// 신안
// ================================


function analyzeShinan(code){



let length="기본";



if(code.startsWith("롱"))
length="롱";



if(code.startsWith("숏"))
length="숏";





let color="";



let colorMatch =
code.match(/#\d+\((.*?)\)/);



if(colorMatch){

color=colorMatch[1];

}






let size="";



let sizeMatch =
code.match(/-(S|M|L|XL|2XL|3XL)$/);



if(sizeMatch){

size=sizeMatch[1];

}




return {


code:code,


color:color,


length:length,


size:size


};



}







// ================================
// 결과 출력
// ================================


function showResult(){



let html=`


<table>


<tr>

<th>상품명</th>

<th>사입명</th>

<th>컬러</th>

<th>기장</th>

<th>사이즈</th>


</tr>


`;



resultData.forEach(item=>{


html+=`


<tr>

<td>${item.productName}</td>

<td>${item.code}</td>

<td>${item.color}</td>

<td>${item.length}</td>

<td>${item.size}</td>


</tr>


`;


});



html+="</table>";



document.getElementById("resultBox")
.innerHTML=html;



}
// ================================
// 확인 필요 데이터 체크
// ================================


function checkNeedConfirm(){


let needColor=[];

let needLength=[];



resultData.forEach(item=>{


if(item.color==="확인필요"){

needColor.push(item.code);

}



if(item.length==="확인필요"){

needLength.push(item.code);

}


});





if(
needColor.length>0 ||
needLength.length>0
){


openPopup(
"⚠️ 확인 필요한 옵션이 있습니다",
`
색상 확인 :
${needColor.join("<br>") || "없음"}

<br><br>

기장 확인 :
${needLength.join("<br>") || "없음"}
`
);



}



}








// ================================
// 팝업
// ================================


function openPopup(title,content){


document.getElementById("popupTitle")
.innerHTML=title;



document.getElementById("popupContent")
.innerHTML=content;



document.getElementById("popup")
.style.display="flex";


}







// ================================
// 재고장 생성
// ================================


function makeStockTable(){



let html=`


<table>


<tr>

<th>상품명</th>

<th>컬러</th>

<th>사입명</th>

<th>기장</th>

<th>사이즈</th>


</tr>


`;





resultData.forEach(item=>{


html+=`

<tr>

<td>${item.productName}</td>

<td>${item.color}</td>

<td>${item.code}</td>

<td>${item.length}</td>

<td>${item.size}</td>


</tr>


`;



});




html+="</table>";



document.getElementById("resultBox")
.innerHTML=html;



}









// ================================
// 엑셀 다운로드
// ================================


function downloadExcel(){



if(resultData.length===0){


alert("먼저 분석해주세요.");

return;


}



makeStockTable();



alert(
"재고장 데이터 생성 완료\n(엑셀 다운로드 기능 연결 예정)"
);



}








// 분석 완료 후 확인

const originalAnalyzeAll = analyzeAll;



analyzeAll = function(){


originalAnalyzeAll();


setTimeout(()=>{


checkNeedConfirm();



},300);


}




</script>


</body>


</html>
