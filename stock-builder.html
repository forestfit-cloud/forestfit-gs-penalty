<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>재고장 생성 툴</title>


<style>

*{
box-sizing:border-box;
}


body{

font-family:Pretendard,
"Malgun Gothic",
sans-serif;

background:#f7f3eb;

padding:40px;

color:#173d2b;

}



h1{

font-size:32px;

margin:0 0 10px;

}



.sub-title{

color:#777;

margin-bottom:30px;

}



.top-area{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:25px;

}



button{

border:none;

border-radius:12px;

padding:12px 20px;

cursor:pointer;

font-size:14px;

font-weight:700;

}



.add-btn{

background:#173d2b;

color:white;

}



.download-btn{

background:#4d8b5b;

color:white;

}



.analyze-btn{

background:#d8a84e;

color:white;

}



.delete-btn{

background:#eeeeee;

color:#777;

}




.card{

background:white;

border-radius:20px;

padding:25px;

margin-bottom:20px;

box-shadow:
0 10px 25px rgba(0,0,0,.08);

}




.card-header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

}




.grid{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:20px;

}



.input-box{

display:flex;

flex-direction:column;

gap:8px;

}



label{

font-size:14px;

font-weight:700;

}



input,
select,
textarea{

border:1px solid #ddd;

border-radius:10px;

padding:12px;

font-size:14px;

}



textarea{

height:180px;

resize:none;

}




.full{

margin-top:20px;

}




.notice{

background:#faf8f3;

border-radius:12px;

padding:15px;

margin-top:20px;

color:#666;

font-size:14px;

}




.result-area{

margin-top:30px;

}



.result-box{

background:white;

border-radius:20px;

padding:25px;

min-height:150px;

box-shadow:
0 10px 25px rgba(0,0,0,.06);

}



.option-table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}



.option-table th,
.option-table td{

border:1px solid #ddd;

padding:10px;

text-align:center;

}



</style>


</head>


<body>



<h1>📦 재고장 생성 툴</h1>


<div class="sub-title">

거래처 재고표 입력 → 상품 옵션 분석 → 재고장 자동 생성

</div>



<div class="top-area">


<button class="add-btn"
onclick="addProduct()">

➕ 상품 추가

</button>


<button class="download-btn"
onclick="downloadExcel()">

📥 재고장 엑셀 다운로드

</button>


</div>




<div id="productArea">

</div>




<div class="result-area">


<h2>

📋 재고장 미리보기

</h2>



<div id="resultBox"
class="result-box">

상품 분석 후 결과가 표시됩니다.

</div>


</div>



<div style="text-align:center;margin-top:30px;">


<button class="analyze-btn"
onclick="analyzeAll()">

🔍 전체 분석

</button>


</div>

    <script>


let productCount = 0;


// 상품 데이터 저장
let products = [];




// 상품 추가

function addProduct(){


productCount++;


const area =
document.getElementById("productArea");



const card =
document.createElement("div");


card.className="card";


card.dataset.id = productCount;



card.innerHTML = `


<div class="card-header">


<h2>
상품 ${productCount}
</h2>


<button class="delete-btn"
onclick="deleteProduct(this)">
삭제
</button>


</div>





<div class="grid">


<div class="input-box">


<label>
상품명 (셀메이트 상품명)
</label>


<input 
class="productName"
placeholder="예) 여름노컷진14탄">


</div>




<div class="input-box">


<label>
거래처
</label>


<select class="company">


<option value="">
거래처 선택
</option>


<option value="lizard">
리자드
</option>


<option value="kdg">
케이디지
</option>


<option value="norunja">
노른자
</option>


<option value="sinabro">
시나브로
</option>


<option value="remind">
리마인드
</option>


<option value="newhang">
뉴행
</option>


<option value="shinan">
신안어패럴
</option>


<option value="jinmoney">
진머니
</option>


<option value="adorable">
아도라블
</option>


<option value="direct">
직접입력
</option>


</select>


</div>


</div>





<div class="input-box full">


<label>
사입 상품명 입력
</label>


<textarea
class="stockName"

placeholder="
재고표 그대로 붙여넣기

예)

2.LC-1084-A1
2.LC-1084-A1SH
2.LC-1084-A1LONG


또는

BA-1025-#1(Blue)-S

"></textarea>


</div>





<div class="notice">

💡 분석 버튼 클릭 시
색상 / 기장 / 사이즈 패턴을 자동 확인합니다.

</div>





<div style="margin-top:20px;">


<button class="analyze-btn"
onclick="analyzeProduct(this)">

🔍 이 상품 분석

</button>


</div>


`;


area.appendChild(card);



}






// 상품 삭제

function deleteProduct(btn){


const card =
btn.closest(".card");


const id =
card.dataset.id;



products =
products.filter(
p=>p.id != id
);



card.remove();


}







// 상품 분석

function analyzeProduct(btn){


const card =
btn.closest(".card");



const data = {


id:
card.dataset.id,


productName:
card.querySelector(".productName").value,


company:
card.querySelector(".company").value,


stockNames:
card.querySelector(".stockName")
.value
.split("\n")
.map(v=>v.trim())
.filter(v=>v)


};



console.log(data);



products.push(data);



document.getElementById("resultBox").innerHTML = `


<h3>
🔎 분석 준비 완료
</h3>


상품명 :
${data.productName || "미입력"}

<br><br>


거래처 :
${data.company || "미선택"}

<br><br>


입력 상품 수 :
${data.stockNames.length}건


<br><br>


다음 단계에서

색상 / 기장 / 사이즈 자동 분석됩니다.


`;



}







// 전체 분석

function analyzeAll(){


if(products.length===0){


alert("상품을 먼저 분석해주세요.");

return;


}



alert(
"전체 분석 기능 연결 예정"
);



}







// 엑셀 다운로드

function downloadExcel(){


alert(
"엑셀 생성 기능 연결 예정"
);


}






// 최초 상품 생성

addProduct();



</script>



</body>

</html>
