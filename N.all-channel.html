<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>FORESTFIT V44 FINAL MATCH ENGINE</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>
body{font-family:Arial;background:#FFF9E8;margin:0}
.wrap{max-width:1200px;margin:auto;padding:30px}
.card{background:#fff;border:1px solid #ddd;padding:12px;margin-bottom:10px}
button{width:100%;padding:10px;background:#C9A227;border:0;font-weight:bold}
h2{margin-bottom:10px}
.small{font-size:12px;color:#777}
</style>
</head>

<body>

<div class="wrap">

<h2>FORESTFIT V44 FINAL ENGINE</h2>

<div class="card">
<input type="file" id="file1">
</div>

<div class="card">
<input type="file" id="file2">
</div>

<div class="card">
<label>공휴일 입력</label>
<textarea id="holiday"></textarea>
</div>

<div class="card">
<button onclick="run()">계산 실행</button>
<button onclick="downloadExcel()">다운로드</button>
</div>

<div id="status"></div>

</div>

<script>

let wb1, wb2;
let result = [];
let brichMap = new Map();

/* =========================
   날짜 변환
========================= */
function fmt(d){
  return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");
}

function toDate(v){
  if(!v) return null;
  if(typeof v === "number"){
    return new Date((v - 25569) * 86400 * 1000);
  }
  const d = new Date(v);
  return isNaN(d) ? null : d;
}

/* =========================
   공휴일
========================= */
function holidays(){
  return document.getElementById("holiday").value
    .split("\n")
    .map(v=>v.trim())
    .filter(Boolean);
}

/* =========================
   영업일 계산
========================= */
function addBiz(date, days, holi){

  let d = new Date(date);
  let c = 0;

  while(c < days){
    d.setDate(d.getDate()+1);

    const day = d.getDay();
    const ymd = fmt(d);

    if(day===0 || day===6) continue;
    if(holi.includes(ymd)) continue;

    c++;
  }

  return d;
}

/* =========================
   옵션 정리
========================= */
function cleanOpt(v){
  return String(v||"")
    .replace(/\s/g,"")
    .replace(/\//g,",")
    .replace(/_/g,"")
    .replace(/기본옵션:옵션/g,"")
    .replace(/[A-Za-z]+\d+/g,"");
}

/* =========================
   괄호 추출
========================= */
function bracket(v){
  const m = String(v||"").match(/\(([^()]*)\)/);
  return m ? m[1] : "";
}

/* =========================
   브리치 MAP
========================= */
function buildBrich(data){
  brichMap.clear();

  for(let i=1;i<data.length;i++){
    const r=data[i];
    if(!r) continue;

    const orderNo = String(r[1]||"");
    brichMap.set(orderNo,r);
  }
}

/* =========================
   비플로우 매칭 (핵심)
========================= */
function matchBrich(orderNo, baseDate, holi, prod, opt){

  const rows = Array.from(brichMap.values());

  for(const r of rows){

    const bOrder = String(r[1]||"");

    if(bOrder !== orderNo) continue;

    const bDate = toDate(r[0]);

    const diff = (bDate - baseDate)/(1000*60*60*24);

    if(diff >= 1 && diff <= 5){

      const bProd = bracket(r[6]);
      const bOpt = cleanOpt(r[11]);

      if(bProd === prod && bOpt === opt){
        return r[19]; // T열
      }
    }
  }

  return "";
}

/* =========================
   L열
========================= */
function calcL(channel, j, holi){

  if(channel.includes("지마켓") || channel.includes("옥션") || channel.includes("SSG")){
    const d = addBiz(j,14,holi);
    return `${channel} 출고준수일 연장전 / 연장시[${fmt(d)}]`;
  }

  if(channel.includes("카카오스타일")){
    const d = addBiz(j,7,holi);
    return `지마켓 출고준수일 연장전 / 연장시[${fmt(d)}]`;
  }

  if(channel.includes("CJ몰")){
    const d = addBiz(j,3,holi);
    return `${channel} 출고준수일 연장전 / 연장시[${fmt(d)}]`;
  }

  if(channel.includes("롯데I몰") || channel.includes("홈앤쇼핑")){
    return `${channel} 출고예정일 연장 불가`;
  }

  return "";
}

/* =========================
   실행
========================= */
function run(){

const d1 = XLSX.utils.sheet_to_json(wb1.Sheets[wb1.SheetNames[0]],{header:1});
const d2 = XLSX.utils.sheet_to_json(wb2.Sheets[wb2.SheetNames[0]],{header:1});

buildBrich(d2);

const holi = holidays();

result = [];

result.push([
"A","B","C","D","E","F","G","H","I","J","K","L"
]);

for(let i=1;i<d1.length;i++){

  const r=d1[i];
  if(!r) continue;

  const seller = r[2];
  const orderNo = r[3];
  const orderDate = toDate(r[0]);

  const prod = bracket(r[6]);
  const opt = cleanOpt(r[7]);

  let j = orderDate;
  let l = calcL(seller,j,holi);

  let match = "";

  if(seller==="비플로우"){
    match = matchBrich(orderNo,orderDate,holi,prod,opt);
  }

  result.push([
    fmt(orderDate),
    r[1],
    r[2],
    r[3],
    r[4],
    r[5],
    prod,
    r[7],
    "",
    j,
    match,
    l
  ]);
}

}

/* =========================
   다운로드
========================= */
function downloadExcel(){
  const ws = XLSX.utils.aoa_to_sheet(result);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"result");
  XLSX.writeFile(wb,"V44_FINAL.xlsx");
}

</script>

</body>
</html>
