```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>포레스트핏 재고장 업무센터</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#f7f3eb 0%,#edf3ef 100%);
  color:#1f2a24;
}

.wrap{
  max-width:1180px;
  margin:0 auto;
  padding:56px 28px 80px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:70px;
}

.logo{
  font-size:24px;
  font-weight:800;
  letter-spacing:.08em;
  color:#244734;
}

.badge{
  padding:10px 16px;
  border-radius:999px;
  background:#ffffffcc;
  color:#486052;
  font-size:14px;
  font-weight:700;
  box-shadow:0 8px 24px rgba(31,42,36,.06);
}

.hero{
  text-align:center;
  margin-bottom:52px;
}

.hero h1{
  font-size:54px;
  line-height:1.15;
  letter-spacing:-.05em;
  color:#173d2b;
  font-weight:850;
  margin-bottom:16px;
}

.hero p{
  font-size:18px;
  color:#6d776f;
  font-weight:600;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:22px;
  max-width:820px;
  margin:0 auto;
}

.card{
  display:block;
  text-decoration:none;
  background:rgba(255,255,255,.86);
  border:1px solid rgba(255,255,255,.9);
  border-radius:28px;
  padding:32px 30px;
  min-height:210px;
  box-shadow:0 18px 45px rgba(38,49,43,.08);
  transition:.22s ease;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 24px 60px rgba(38,49,43,.14);
}

.icon{
  width:48px;
  height:48px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  margin-bottom:28px;
}

.card:nth-child(1) .icon{
  background:#e7f0ff;
}

.card:nth-child(2) .icon{
  background:#e6f5ec;
}

.card h2{
  font-size:27px;
  letter-spacing:-.04em;
  color:#173d2b;
  font-weight:850;
  margin-bottom:10px;
}

.card span{
  display:block;
  font-size:15px;
  line-height:1.6;
  color:#7c867f;
  font-weight:600;
}

.footer{
  margin-top:42px;
  text-align:center;
  color:#9aa39d;
  font-size:13px;
  font-weight:600;
}

@media(max-width:900px){
  .grid{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:38px;
  }

  .top{
    margin-bottom:48px;
  }
}
</style>
</head>

<body>

  <div class="wrap">

    <div class="top">
      <div class="logo">FORESTFIT</div>
      <div class="badge">상품운영팀 재고 업무툴</div>
    </div>

    <section class="hero">
      <h1>재고장 업무센터</h1>
      <p>재고장 생성 및 거래처 재고 입력 업무를 관리합니다.</p>
    </section>

    <section class="grid">

      <a class="card" href="stock-builder.html">
        <div class="icon">📊</div>
        <h2>재고장 재생성(월)</h2>
        <span>
          월별 재고장 파일을 새로 생성하고<br>
          재고장 양식을 관리합니다.
        </span>
      </a>

      <a class="card" href="kdg-stock-match.html">
        <div class="icon">🔗</div>
        <h2>거래처 재고 입력</h2>
        <span>
          케이디지 거래처 재고를 매칭하여<br>
          재고장에 자동으로 입력합니다.
        </span>
      </a>

    </section>

    <div class="footer">
      FORESTFIT STOCK CENTER
    </div>

  </div>

</body>
</html>
```
