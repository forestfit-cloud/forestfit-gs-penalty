<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포레스트핏 업무센터</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Malgun Gothic',sans-serif;
}

body{
background:#f5f6f7;
}

.header{
background:linear-gradient(90deg,#1f4d3a,#0d6b47);
color:white;
padding:25px 40px;
font-size:40px;
font-weight:700;
}

.container{
max-width:1400px;
margin:60px auto;
padding:0 20px;
}

.title{
text-align:center;
font-size:72px;
font-weight:800;
color:#0d6b47;
margin-bottom:20px;
}

.sub-title{
text-align:center;
font-size:42px;
font-weight:600;
color:#0d6b47;
margin-bottom:60px;
}

.cards{
display:flex;
justify-content:center;
gap:40px;
flex-wrap:wrap;
}

.card{
background:white;
width:360px;
height:260px;
border-radius:24px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
font-weight:700;
color:#0d6b47;
cursor:pointer;
transition:0.25s;
text-decoration:none;
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 15px 40px rgba(0,0,0,0.15);
}

@media(max-width:900px){

.title{
font-size:48px;
}

.sub-title{
font-size:28px;
}

.card{
width:100%;
max-width:500px;
height:180px;
font-size:30px;
}
}
</style>
</head>

<body>

<div class="header">
FORESTFIT
</div>

<div class="container">

<div class="title">
포레스트핏 업무센터
</div>

<div class="sub-title">
상품운영팀
</div>

<div class="cards">

<a class="card" href="#">
GS 패널티 관리
</a>

<a class="card" href="#">
장기지연건 관리
</a>

<a class="card" href="#">
재고매칭 확인
</a>

</div>

</div>

</body>
</html>
