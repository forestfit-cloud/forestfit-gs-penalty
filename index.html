<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포레스트핏 업무센터</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Malgun Gothic', sans-serif;
}

body{
  background:#f5f6f7;
  color:#123326;
}

.header{
  background:linear-gradient(90deg,#1f4d3a,#0d6b47);
  color:white;
  padding:18px 30px;
  font-size:34px;
  font-weight:800;
  letter-spacing:.5px;
}

.container{
  max-width:1100px;
  margin:70px auto;
  padding:0 24px;
}

.title{
  text-align:center;
  font-size:56px;
  font-weight:900;
  color:#0d6b47;
  margin-bottom:18px;
}

.sub-title{
  text-align:center;
  font-size:24px;
  font-weight:700;
  color:#0d6b47;
  margin-bottom:46px;
}

.cards{
  display:flex;
  justify-content:center;
  gap:28px;
  flex-wrap:wrap;
}

.card{
  background:#ffffff;
  width:300px;
  height:180px;
  border-radius:22px;
  box-shadow:0 10px 28px rgba(0,0,0,0.08);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:32px;
  font-weight:800;
  color:#0d6b47;
  text-decoration:none;
  cursor:pointer;
  transition:.22s ease;
  border:1px solid #edf1ef;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 16px 38px rgba(0,0,0,0.14);
}

@media(max-width:900px){
  .header{
    font-size:28px;
    padding:16px 22px;
  }

  .title{
    font-size:42px;
  }

  .sub-title{
    font-size:22px;
  }

  .card{
    width:100%;
    max-width:420px;
    height:150px;
    font-size:28px;
  }
}
</style>
</head>

<body>

<div class="header">FORESTFIT</div>

<div class="container">
  <div class="title">포레스트핏 업무센터</div>
  <div class="sub-title">상품운영팀</div>

  <div class="cards">
    <a class="card" href="#">GS 패널티</a>
    <a class="card" href="#">장기지연건</a>
    <a class="card" href="#">재고매칭</a>
  </div>
</div>

</body>
</html>
